name: H003 Activation Hash Probe

on:
  push:
    branches:
      - research/h003-prospective-activation-v2
    paths:
      - ".github/workflows/h003-activation-hash-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source qualification merge ancestry
        run: git merge-base --is-ancestor 1827bb3e753970aed0cfbd0adc27bba121b41d5d HEAD
      - name: Print exact source SHA256
        run: sha256sum qntylab/h003_defensive_followup_v1_prospective_source_v2.py
