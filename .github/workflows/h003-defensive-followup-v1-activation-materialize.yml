name: H003 Defensive Follow-up V1 Activation Materialize

on:
  push:
    branches:
      - research/h003-defensive-followup-v1-activation
    paths:
      - "qntylab/h003_defensive_followup_v1_activation.py"
      - "tests/test_h003_defensive_followup_v1_activation.py"
      - "tools/h003_defensive_followup_v1_activation_materialize.py"
      - ".github/workflows/h003-defensive-followup-v1-activation-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install numpy pytest requests
      - name: Verify result-blind activation compiler
        run: PYTHONPATH=. python -m pytest -q tests/test_h003_defensive_followup_v1_activation.py
      - name: Materialize exact activation contract and reopen
        run: |
          PYTHONPATH=. python tools/h003_defensive_followup_v1_activation_materialize.py
          PYTHONPATH=. python -m qntylab.research_ledger reopen --event experiments/research/h003_defensive_followup_v1/activation_reopen_event.json
      - name: Verify scoped activation is fail closed outside exact IDs
        run: |
          PYTHONPATH=. python -m qntylab.research_ledger doctor
          PYTHONPATH=. python -m pytest -q \
            tests/test_h003_defensive_followup_v1_activation.py \
            tests/test_h003_edge_falsification_v0_reopen_authorization.py
          git diff --check
      - name: Commit bounded activation evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/specs/h003_defensive_followup_v1_activation.json \
            experiments/research/h003_defensive_followup_v1/activation_reopen_event.json \
            experiments/research/candidates.jsonl \
            experiments/research/state.json \
            experiments/research/trial_index.json
          if ! git diff --cached --quiet; then
            git commit -m "research: activate scoped H003 defensive follow-up v1"
            git push origin "HEAD:research/h003-defensive-followup-v1-activation"
          fi
