name: H003 Defensive Follow-up V1 Blocked Materialize

on:
  push:
    branches:
      - research/h003-defensive-followup-v1-prereg
    paths:
      - "experiments/specs/h003_defensive_followup_v1.json"
      - "tests/test_h003_defensive_followup_v1_prereg.py"
      - "tests/test_h003_edge_falsification_v0_reopen_authorization.py"
      - "tools/h003_defensive_followup_v1_blocked_materialize.py"
      - ".github/workflows/h003-defensive-followup-v1-blocked-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install numpy pytest requests
      - name: Verify frozen contract before materialization
        run: PYTHONPATH=. python -m pytest -q tests/test_h003_defensive_followup_v1_prereg.py
      - name: Rebuild final governance event from canonical base
        run: |
          PYTHONPATH=. python tools/h003_defensive_followup_v1_blocked_materialize.py
          PYTHONPATH=. python -m qntylab.research_ledger decide --event experiments/research/h003_defensive_followup_v1/decision_event.json
      - name: Verify final fail-closed canonical ledger
        run: |
          PYTHONPATH=. python -m qntylab.research_ledger doctor
          PYTHONPATH=. python -m pytest -q \
            tests/test_h003_defensive_followup_v1_prereg.py \
            tests/test_h003_edge_falsification_v0_reopen_authorization.py
          git diff --check
      - name: Commit bounded final governance evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/research/h003_defensive_followup_v1/decision_event.json \
            experiments/research/decisions.jsonl \
            experiments/research/state.json \
            experiments/research/trial_index.json
          if ! git diff --cached --quiet; then
            git commit -m "research: block H003 follow-up pending scoped activation"
            git push origin "HEAD:research/h003-defensive-followup-v1-prereg"
          fi
