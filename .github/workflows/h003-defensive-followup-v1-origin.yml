name: H003 Defensive Follow-up V1 Origin

on:
  pull_request:
    paths:
      - "experiments/research/h003_defensive_followup_v1/prospective_origin.json"
      - "experiments/specs/h003_defensive_followup_v1.json"
      - "experiments/specs/h003_defensive_followup_v1_activation.json"
      - "tests/test_h003_defensive_followup_v1_origin.py"
      - ".github/workflows/h003-defensive-followup-v1-origin.yml"
  push:
    branches:
      - master
    paths:
      - "experiments/research/h003_defensive_followup_v1/prospective_origin.json"
      - "experiments/specs/h003_defensive_followup_v1.json"
      - "experiments/specs/h003_defensive_followup_v1_activation.json"
      - "tests/test_h003_defensive_followup_v1_origin.py"
      - ".github/workflows/h003-defensive-followup-v1-origin.yml"

permissions:
  contents: read

jobs:
  origin-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install pytest requests
      - name: Verify Git-derived prospective origin and authority boundary
        run: PYTHONPATH=. python -m pytest -q tests/test_h003_defensive_followup_v1_origin.py
      - name: Verify research ledger remains healthy
        run: PYTHONPATH=. python -m qntylab.research_ledger doctor
      - name: Verify bounded diff hygiene
        run: git diff --check
