name: H003 Defensive Follow-up V1 Review Repair

on:
  push:
    branches:
      - research/h003-defensive-followup-v1-prereg
    paths:
      - "experiments/specs/h003_defensive_followup_v1.json"
      - "tests/test_h003_defensive_followup_v1_prereg.py"
      - "tools/h003_defensive_followup_v1_review_repair.py"
      - ".github/workflows/h003-defensive-followup-v1-review-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install numpy pytest requests
      - name: Verify repaired preregistration before materialization
        run: PYTHONPATH=. python -m pytest -q tests/test_h003_defensive_followup_v1_prereg.py
      - name: Rebuild corrected governance event from canonical base
        run: |
          PYTHONPATH=. python tools/h003_defensive_followup_v1_review_repair.py
          PYTHONPATH=. python -m qntylab.research_ledger decide --event experiments/research/h003_defensive_followup_v1/decision_event.json
      - name: Verify corrected canonical ledger
        run: |
          PYTHONPATH=. python -m qntylab.research_ledger doctor
          git diff --check
      - name: Commit bounded corrected governance evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/research/h003_defensive_followup_v1/decision_event.json \
            experiments/research/decisions.jsonl \
            experiments/research/state.json \
            experiments/research/trial_index.json
          if ! git diff --cached --quiet; then
            git commit -m "research: repair H003 defensive follow-up v1 decision"
            git push origin "HEAD:research/h003-defensive-followup-v1-prereg"
          fi
