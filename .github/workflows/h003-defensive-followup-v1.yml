name: H003 Defensive Follow-up V1

on:
  pull_request:
    paths:
      - "experiments/specs/h003_defensive_followup_v1.json"
      - "experiments/research/h003_defensive_followup_v1/decision_event.json"
      - "experiments/research/decisions.jsonl"
      - "experiments/research/state.json"
      - "experiments/research/trial_index.json"
      - "tests/test_h003_defensive_followup_v1_prereg.py"
      - ".github/workflows/h003-defensive-followup-v1.yml"
  push:
    branches:
      - master
    paths:
      - "experiments/specs/h003_defensive_followup_v1.json"
      - "experiments/research/h003_defensive_followup_v1/decision_event.json"
      - "experiments/research/decisions.jsonl"
      - "experiments/research/state.json"
      - "experiments/research/trial_index.json"
      - "tests/test_h003_defensive_followup_v1_prereg.py"
      - ".github/workflows/h003-defensive-followup-v1.yml"

permissions:
  contents: read

jobs:
  prereg-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install numpy pytest requests
      - name: Verify frozen follow-up contract
        run: PYTHONPATH=. python -m pytest -q tests/test_h003_defensive_followup_v1_prereg.py
      - name: Verify research ledger
        run: PYTHONPATH=. python -m qntylab.research_ledger doctor
      - name: Verify bounded diff hygiene
        run: git diff --check
