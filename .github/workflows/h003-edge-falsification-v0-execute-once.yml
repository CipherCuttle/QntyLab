name: H003 Edge Falsification V0 Execute Once

on:
  push:
    branches:
      - research/h003-edge-falsification-v0-execution
    paths:
      - ".github/workflows/h003-edge-falsification-v0-execute-once.yml"

permissions:
  contents: write

jobs:
  execute-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen runtime dependencies
        run: python -m pip install numpy requests
      - name: Reconstruct and attest exact frozen SOLUSDT input
        id: input
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations
          import json
          import shutil
          from datetime import UTC, datetime
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from qntylab.data import fetch

          expected = {
              "symbol": "SOLUSDT",
              "timeframe": "1h",
              "rows": 49831,
              "start": "2021-01-01T00:00:00Z",
              "end": "2026-09-08T20:00:00Z",
              "sha256": "64bdb27a31003b0de25f3802affa8b412143a50bc8a5b76a399924626b01174a",
          }
          workspace = Path("experiments/runs/h003_edge_falsification_v0")
          workspace.mkdir(parents=True, exist_ok=True)
          receipt_path = workspace / "input_attestation.json"
          receipt = {
              "schema_version": "1.0.0",
              "authorization_id": "H003_EDGE_FALSIFICATION_V0",
              "expected": expected,
              "observed": None,
              "status": "ACQUISITION_ERROR",
              "canonical_match": False,
              "authority": {
                  "qntylab_research_only": True,
                  "qnty_acceptance": "NONE",
                  "qntyspot_policy": "NONE",
                  "execution": "RESEARCH_BACKTEST_ONLY",
                  "capital": "NONE",
                  "signing": "NONE",
                  "submission": "NONE",
              },
          }
          try:
              with TemporaryDirectory(prefix="h003-v0-execution-input-") as directory:
                  root = Path(directory)
                  (root / "data/manifests").mkdir(parents=True, exist_ok=True)
                  manifest = fetch(
                      "SOLUSDT",
                      "2021-01-01T00:00:00",
                      root,
                      interval="1h",
                      end=datetime(2026, 9, 8, 21, 3, 17, 228114, tzinfo=UTC),
                  )
                  observed = {key: manifest[key] for key in expected}
                  receipt["observed"] = observed
                  mismatches = {key: {"expected": expected[key], "observed": observed[key]} for key in expected if observed[key] != expected[key]}
                  receipt["mismatches"] = mismatches
                  if mismatches:
                      receipt["status"] = "MISMATCH"
                  else:
                      raw = root / "data/raw/SOLUSDT-1h.csv"
                      destination = Path("data/raw/SOLUSDT-1h.csv")
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copyfile(raw, destination)
                      receipt["status"] = "CANONICAL_MATCH"
                      receipt["canonical_match"] = True
          except Exception as exc:  # fail-closed evidence boundary
              receipt["error"] = {"type": type(exc).__name__, "message": " ".join(str(exc).split())[:512]}
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          raise SystemExit(0 if receipt["canonical_match"] is True else 3)
          PY
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Execute frozen 44-trial matrix and analyze once
        id: trial
        if: steps.input.outputs.status == '0'
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations
          import json
          import traceback
          from pathlib import Path
          from qntylab.h003_edge_falsification_v0_execution import execute_frozen_plan, analyze_frozen_results

          workspace = Path("experiments/runs/h003_edge_falsification_v0")
          failure_path = workspace / "execution_failure.json"
          try:
              execution = execute_frozen_plan(workspace)
              analysis = analyze_frozen_results(workspace)
              print(json.dumps({
                  "execution_trial_count": execution["trial_count"],
                  "executed": len(execution["executed_trial_ids"]),
                  "resumed": len(execution["resumed_verified_trial_ids"]),
                  "verdict": analysis["verdict"],
                  "decision_summary": analysis["decision_summary"],
              }, indent=2, sort_keys=True))
          except Exception as exc:
              failure = {
                  "schema_version": "1.0.0",
                  "authorization_id": "H003_EDGE_FALSIFICATION_V0",
                  "status": "EXECUTION_OR_ANALYSIS_ERROR",
                  "exception_type": type(exc).__name__,
                  "message": " ".join(str(exc).split())[:1024],
                  "traceback": traceback.format_exc(limit=20),
              }
              failure_path.write_text(json.dumps(failure, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print(json.dumps(failure, indent=2, sort_keys=True))
              raise SystemExit(4)
          PY
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify research ledger after recorded trials
        id: ledger
        if: always()
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python -m qntylab.research_ledger doctor
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve immutable execution evidence on branch
        if: always()
        shell: bash
        env:
          HEAD_REF: research/h003-edge-falsification-v0-execution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/research experiments/runs/h003_edge_falsification_v0
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "research: record H003 edge falsification v0 execution evidence [skip ci]"
            git push origin "HEAD:${HEAD_REF}"
          fi
      - name: Enforce fail-closed job result
        if: always()
        shell: bash
        run: |
          input_status='${{ steps.input.outputs.status }}'
          trial_status='${{ steps.trial.outputs.status }}'
          ledger_status='${{ steps.ledger.outputs.status }}'
          echo "input_status=${input_status:-not-run} trial_status=${trial_status:-not-run} ledger_status=${ledger_status:-not-run}"
          test "${input_status}" = "0"
          test "${trial_status}" = "0"
          test "${ledger_status}" = "0"
