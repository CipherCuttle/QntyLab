name: H003 Edge Falsification V0 Reopen

on:
  pull_request:
    paths:
      - "experiments/research/h003_edge_falsification_v0/reopen_event.json"
      - "experiments/research/candidates.jsonl"
      - "experiments/research/state.json"
      - "experiments/research/trial_index.json"
      - "experiments/specs/h003_edge_falsification_v0.json"
      - "experiments/specs/h003_edge_falsification_v0_analysis_contract.json"
      - "experiments/specs/h003_edge_falsification_v0_trial_authorization.json"
      - "qntylab/research_ledger.py"
      - "tests/test_h003_edge_falsification_v0_prereg.py"
      - "tests/test_h003_edge_falsification_v0_reopen.py"
      - "tests/test_h003_edge_falsification_v0_reopen_authorization.py"
      - "tests/test_research_ledger_reopen_chronology.py"
      - ".github/workflows/h003-edge-falsification-v0-reopen.yml"
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  reopen-lock:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply consumed-reopen chronology fix and rebuild indexes
        run: |
          PYTHONPATH=. python tools/h003_reopen_chronology_fix.py
          PYTHONPATH=. python - <<'PY'
          from qntylab import research_ledger
          research_ledger.rebuild()
          issues = research_ledger.doctor()
          if issues:
              raise SystemExit("; ".join(issues))
          PY
      - name: Install focused dependencies
        run: python -m pip install numpy pytest requests
      - name: Verify scoped reopen and chronology
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_h003_edge_falsification_v0_prereg.py \
            tests/test_h003_edge_falsification_v0_reopen.py \
            tests/test_h003_edge_falsification_v0_reopen_authorization.py \
            tests/test_research_ledger_reopen_chronology.py
          PYTHONPATH=. python -m qntylab.research_ledger doctor
          git diff --check
      - name: Commit chronology repair and regenerated indexes
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            qntylab/research_ledger.py \
            experiments/research/state.json \
            experiments/research/trial_index.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: preserve terminal decisions after consumed reopen"
          git push origin "HEAD:${HEAD_REF}"
