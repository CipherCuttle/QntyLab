name: H003 Edge Falsification V0 Runner

on:
  pull_request:
    paths:
      - "qntylab/h003_edge_falsification_v0.py"
      - "qntylab/h003_edge_falsification_v0_execution.py"
      - "qntylab/strategy_test.py"
      - "experiments/specs/h003_edge_falsification_v0_analysis_contract.json"
      - "tests/test_h003_edge_falsification_v0_runner.py"
      - "tests/test_h003_edge_falsification_v0_execution.py"
      - "tests/test_strategy_test_historical_provenance.py"
      - "tools/h003_v0_execution_binding_fix.py"
      - ".github/workflows/h003-edge-falsification-v0-runner.yml"

permissions:
  contents: write

jobs:
  freeze-runner:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply execution binding repair
        run: PYTHONPATH=. python tools/h003_v0_execution_binding_fix.py
      - name: Install focused dependencies
        run: python -m pip install numpy pytest requests
      - name: Verify frozen runner, analyzer, and provenance seams
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_h003_edge_falsification_v0_runner.py \
            tests/test_h003_edge_falsification_v0_execution.py \
            tests/test_strategy_test_historical_provenance.py
          git diff --check
      - name: Commit execution binding repair
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qntylab/h003_edge_falsification_v0_execution.py tests/test_h003_edge_falsification_v0_execution.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: bind H003 V0 execution ledger root"
          git push origin "HEAD:${HEAD_REF}"
