name: H003 Edge Falsification V0 Runner

on:
  pull_request:
    paths:
      - "qntylab/h003_edge_falsification_v0.py"
      - "qntylab/strategy_test.py"
      - "tests/test_h003_edge_falsification_v0_runner.py"
      - "tests/test_strategy_test_historical_provenance.py"
      - ".github/workflows/h003-edge-falsification-v0-runner.yml"
  push:
    branches: [master]
    paths:
      - "qntylab/h003_edge_falsification_v0.py"
      - "qntylab/strategy_test.py"
      - "tests/test_h003_edge_falsification_v0_runner.py"
      - "tests/test_strategy_test_historical_provenance.py"
      - ".github/workflows/h003-edge-falsification-v0-runner.yml"

permissions:
  contents: read

jobs:
  freeze-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install numpy pytest requests
      - name: Verify result-blind compiler and provenance seam
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_h003_edge_falsification_v0_runner.py \
            tests/test_strategy_test_historical_provenance.py
          git diff --check
