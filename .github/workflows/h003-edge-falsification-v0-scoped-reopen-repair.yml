name: H003 scoped reopen repair materializer

on:
  pull_request:
    paths:
      - ".github/workflows/h003-edge-falsification-v0-scoped-reopen-repair.yml"

permissions:
  contents: write

jobs:
  patch-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patch scoped reopen consumption boundary and 193-bar continuity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          ledger = "qntylab/research_ledger.py"
          replace_once(
              ledger,
              '''CANDIDATE_REOPENED_KEYS = {
              "event_id",
              "event_type",
              "candidate_id",
              "variant_id",
              "previous_decision_event_id",
              "reason",
              "material_change",
              "recorded_at_utc",
          }
          DECISION_KEYS = {'''.replace("          ", ""),
              '''CANDIDATE_REOPENED_KEYS = {
              "event_id",
              "event_type",
              "candidate_id",
              "variant_id",
              "previous_decision_event_id",
              "reason",
              "material_change",
              "recorded_at_utc",
          }
          CANDIDATE_REOPENED_OPTIONAL_KEYS = {
              "authorization_contract_path",
              "authorization_contract_sha256",
          }
          REOPEN_AUTHORIZATION_CONTRACT_KEYS = {
              "schema_version",
              "authorization_id",
              "reopen_event_id",
              "candidate_id",
              "variant_id",
              "allowed_research_intents",
              "authorized_trial_ids",
              "metadata",
          }
          DECISION_KEYS = {'''.replace("          ", ""),
          )
          replace_once(
              ledger,
              '''    elif event_type == "CANDIDATE_REOPENED":
                  _require_keys(event, CANDIDATE_REOPENED_KEYS, event_type)
                  _require_non_empty_string(event, ("event_id", "candidate_id", "variant_id", "previous_decision_event_id", "recorded_at_utc"))
                  if not isinstance(event["reason"], str) or len(event["reason"].strip()) < 12:
                      raise LedgerError("reopen reason must be concrete and non-empty")
                  if not isinstance(event["material_change"], str) or not event["material_change"].strip():
                      raise LedgerError("material_change must be a non-empty string")
''',
              '''    elif event_type == "CANDIDATE_REOPENED":
                  _require_keys(event, CANDIDATE_REOPENED_KEYS, event_type, optional=CANDIDATE_REOPENED_OPTIONAL_KEYS)
                  _require_non_empty_string(event, ("event_id", "candidate_id", "variant_id", "previous_decision_event_id", "recorded_at_utc"))
                  if not isinstance(event["reason"], str) or len(event["reason"].strip()) < 12:
                      raise LedgerError("reopen reason must be concrete and non-empty")
                  if not isinstance(event["material_change"], str) or not event["material_change"].strip():
                      raise LedgerError("material_change must be a non-empty string")
                  contract_path = event.get("authorization_contract_path")
                  contract_sha = event.get("authorization_contract_sha256")
                  if (contract_path is None) != (contract_sha is None):
                      raise LedgerError("reopen authorization contract path and SHA-256 must be declared together")
                  if contract_path is not None:
                      _require_non_empty_string(event, ("authorization_contract_path", "authorization_contract_sha256"))
                      if Path(contract_path).is_absolute():
                          raise LedgerError("reopen authorization contract path must be repository-relative")
                      if len(contract_sha) != 64:
                          raise LedgerError("reopen authorization contract SHA-256 must be 64 hex characters")
                      try:
                          int(contract_sha, 16)
                      except ValueError as exc:
                          raise LedgerError("reopen authorization contract SHA-256 must be hexadecimal") from exc
''',
          )
          replace_once(
              ledger,
              '''        variant["status"] = "PROPOSED"
                  variant["latest_decision_event_id"] = None

              for event in history.trials:
''',
              '''        variant["status"] = "PROPOSED"
                  variant["latest_decision_event_id"] = None
                  for key in (
                      "active_reopen_event_id",
                      "reopen_authorization_contract_path",
                      "reopen_authorization_contract_sha256",
                  ):
                      variant.pop(key, None)
                  if event.get("authorization_contract_path") is not None:
                      variant["active_reopen_event_id"] = event["event_id"]
                      variant["reopen_authorization_contract_path"] = event["authorization_contract_path"]
                      variant["reopen_authorization_contract_sha256"] = event["authorization_contract_sha256"]

              for event in history.trials:
''',
          )
          helper = '''\n\ndef _load_reopen_authorization_contract(*, variant: dict[str, Any], root: Path) -> dict[str, Any] | None:\n    path_value = variant.get("reopen_authorization_contract_path")\n    sha_value = variant.get("reopen_authorization_contract_sha256")\n    event_id_value = variant.get("active_reopen_event_id")\n    if path_value is None and sha_value is None and event_id_value is None:\n        return None\n    if not all(isinstance(value, str) and value.strip() for value in (path_value, sha_value, event_id_value)):\n        raise LedgerError("active reopen authorization state is incomplete")\n    if Path(path_value).is_absolute():\n        raise LedgerError("active reopen authorization contract path must be repository-relative")\n    repo_root = root.parent.parent.resolve()\n    contract_path = (repo_root / path_value).resolve()\n    try:\n        contract_path.relative_to(repo_root)\n    except ValueError as exc:\n        raise LedgerError("active reopen authorization contract escapes repository root") from exc\n    if not contract_path.is_file():\n        raise LedgerError(f"active reopen authorization contract missing: {path_value}")\n    if sha256_path(contract_path) != sha_value:\n        raise LedgerError("active reopen authorization contract SHA-256 mismatch")\n    try:\n        contract = json.loads(contract_path.read_text(encoding="utf-8"))\n    except json.JSONDecodeError as exc:\n        raise LedgerError("active reopen authorization contract is malformed JSON") from exc\n    if not isinstance(contract, dict):\n        raise LedgerError("active reopen authorization contract must be a JSON object")\n    extra = set(contract) - REOPEN_AUTHORIZATION_CONTRACT_KEYS\n    missing = REOPEN_AUTHORIZATION_CONTRACT_KEYS - set(contract)\n    if extra or missing:\n        raise LedgerError(f"active reopen authorization contract keys invalid: extra={sorted(extra)} missing={sorted(missing)}")\n    if contract["schema_version"] != "1.0.0":\n        raise LedgerError("unsupported reopen authorization contract schema")\n    for key in ("authorization_id", "reopen_event_id", "candidate_id", "variant_id"):\n        if not isinstance(contract[key], str) or not contract[key].strip():\n            raise LedgerError(f"reopen authorization contract {key} must be a non-empty string")\n    if contract["reopen_event_id"] != event_id_value:\n        raise LedgerError("reopen authorization contract event identity mismatch")\n    if contract["candidate_id"] != variant["candidate_id"] or contract["variant_id"] != variant.get("variant_id", contract["variant_id"]):\n        raise LedgerError("reopen authorization contract variant identity mismatch")\n    intents = contract["allowed_research_intents"]\n    if not isinstance(intents, list) or not intents or len(intents) != len(set(intents)) or any(intent not in RESEARCH_INTENTS for intent in intents):\n        raise LedgerError("reopen authorization contract allowed_research_intents invalid")\n    trial_ids = contract["authorized_trial_ids"]\n    if not isinstance(trial_ids, list) or not trial_ids or len(trial_ids) != len(set(trial_ids)) or not all(isinstance(item, str) and item.startswith("trial_") for item in trial_ids):\n        raise LedgerError("reopen authorization contract authorized_trial_ids invalid")\n    if not isinstance(contract["metadata"], dict):\n        raise LedgerError("reopen authorization contract metadata must be an object")\n    return contract\n'''
          replace_once(ledger, "\ndef preflight(\n", helper + "\n\ndef preflight(\n")
          replace_once(
              ledger,
              '''    if trial_id in trial_index["trials"] and config.get("research_intent") != "REPLICATION":
                  raise LedgerError("exact trial already completed")
              return {
''',
              '''    reopen_authorization = _load_reopen_authorization_contract(variant={**variant, "variant_id": variant_id}, root=root)
              reopen_authorization_id = None
              if reopen_authorization is not None:
                  reopen_authorization_id = reopen_authorization["authorization_id"]
                  if config.get("research_intent") not in reopen_authorization["allowed_research_intents"]:
                      raise LedgerError("research_intent not authorized by active reopen contract")
                  if trial_id not in reopen_authorization["authorized_trial_ids"]:
                      raise LedgerError("trial not authorized by active reopen contract")
              if trial_id in trial_index["trials"] and config.get("research_intent") != "REPLICATION":
                  raise LedgerError("exact trial already completed")
              return {
''',
          )
          replace_once(
              ledger,
              '''        "research_intent": config.get("research_intent"),
                  "status": status,
''',
              '''        "research_intent": config.get("research_intent"),
                  "reopen_authorization_id": reopen_authorization_id,
                  "status": status,
''',
          )

          analysis_path = Path("experiments/specs/h003_edge_falsification_v0_analysis_contract.json")
          analysis = json.loads(analysis_path.read_text(encoding="utf-8"))
          analysis["state_continuity"]["minimum_pre_block_history_closes"] = 193
          analysis["state_continuity"]["official_trial_role"] = (
              "An official qntylab.strategy_test path-attestation run must use an exact window frozen in "
              "experiments/specs/h003_edge_falsification_v0_trial_authorization.json. For non-reset reporting "
              "boundaries this supplies 193 preceding closes so the one-bar-shifted predecessor position is "
              "causally reconstructible. The analyzer must first match that official run on its full attested "
              "window, reconstruct H003 on the full window, and only then slice the reporting block. Passing a "
              "bare calendar-year close array directly to positions() is forbidden."
          )
          analysis["gap_and_input_semantics"]["OTHER_BLOCKS"]["policy"] = (
              "Use exact authoritative raw input. Every non-reset reporting block must use the exact 193-close "
              "prehistory window frozen in experiments/specs/h003_edge_falsification_v0_trial_authorization.json. "
              "qntylab.strategy_test must reject any unexpected gap in the attested window. Any newly discovered "
              "gap blocks the affected path and cannot be normalized after result inspection."
          )
          constraint = (
              "Any post-graveyard H003 strategy_test trial must be admitted by the SHA-pinned active reopen "
              "authorization contract at the central research_ledger.preflight boundary; prose-only authorization "
              "or wrapper-only checks are insufficient."
          )
          if constraint not in analysis["implementation_constraints"]:
              analysis["implementation_constraints"].insert(1, constraint)
          analysis_path.write_text(json.dumps(analysis, indent=2) + "\n", encoding="utf-8")

          prereg_test = Path("tests/test_h003_edge_falsification_v0_prereg.py")
          text = prereg_test.read_text(encoding="utf-8")
          text = text.replace('assert continuity["minimum_pre_block_history_closes"] == 192', 'assert continuity["minimum_pre_block_history_closes"] == 193')
          text = text.replace('at least the preceding 192 contiguous hourly closes', 'exact 193-close prehistory window')
          prereg_test.write_text(text, encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install numpy pytest requests
      - name: Run focused repair tests before commit
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_h003_edge_falsification_v0_prereg.py \
            tests/test_h003_edge_falsification_v0_reopen.py \
            tests/test_h003_edge_falsification_v0_reopen_authorization.py
      - name: Commit repair to PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qntylab/research_ledger.py \
            experiments/specs/h003_edge_falsification_v0_analysis_contract.json \
            tests/test_h003_edge_falsification_v0_prereg.py
          git commit -m "research: enforce scoped reopen authorization"
          git push origin "HEAD:${HEAD_REF}"
