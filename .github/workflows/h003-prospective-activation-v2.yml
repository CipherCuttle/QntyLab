name: H003 Prospective Activation V2 / Closure Lock

on:
  push:
    branches:
      - master
      - research/h003-prospective-activation-v2
    paths:
      - ".github/workflows/h003-prospective-activation-v2.yml"
      - ".github/workflows/h003-prospective-operation-v2.yml"
      - "experiments/research/h003_defensive_followup_v1/prospective_source_v2_activation.json"
      - "experiments/research/h003_defensive_followup_v1/prospective_source_v2_runtime.json"
      - "experiments/research/h003_defensive_followup_v1/prospective_v2_closure.json"
      - "experiments/research/h003_defensive_followup_v1/prospective_v2_terminal_ledger.jsonl"
      - "qntylab/h003_defensive_followup_v1_prospective_source_v2.py"
      - "tests/test_h003_defensive_followup_v1_prospective_activation_v2.py"
      - "tests/test_h003_defensive_followup_v1_prospective_source_v2.py"
      - "tests/test_h003_prospective_v2_closure.py"
  pull_request:
    paths:
      - ".github/workflows/h003-prospective-activation-v2.yml"
      - ".github/workflows/h003-prospective-operation-v2.yml"
      - "experiments/research/h003_defensive_followup_v1/prospective_source_v2_activation.json"
      - "experiments/research/h003_defensive_followup_v1/prospective_source_v2_runtime.json"
      - "experiments/research/h003_defensive_followup_v1/prospective_v2_closure.json"
      - "experiments/research/h003_defensive_followup_v1/prospective_v2_terminal_ledger.jsonl"
      - "qntylab/h003_defensive_followup_v1_prospective_source_v2.py"
      - "tests/test_h003_defensive_followup_v1_prospective_activation_v2.py"
      - "tests/test_h003_defensive_followup_v1_prospective_source_v2.py"
      - "tests/test_h003_prospective_v2_closure.py"

permissions:
  contents: read

jobs:
  activation-v2-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install focused frozen dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.5.3" "pytest==9.1.1" "requests==2.34.2"
      - name: Verify frozen source and historical active-runtime identities
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1827bb3e753970aed0cfbd0adc27bba121b41d5d HEAD
          git merge-base --is-ancestor 6612ce47fbcea02cd001bf9f7ca1447313a8abd2 HEAD
          test "$(sha256sum qntylab/h003_defensive_followup_v1_prospective_source_v2.py | awk '{print $1}')" = "74e1906f1bb54123ff77347629d5da6bafcd400b9a979d6d5526bbc6ccf08633"
          HISTORICAL_WORKFLOW_SHA="$(git show 6612ce47fbcea02cd001bf9f7ca1447313a8abd2:.github/workflows/h003-prospective-operation-v2.yml | sha256sum | awk '{print $1}')"
          test "$HISTORICAL_WORKFLOW_SHA" = "bbf881c9daec8c2cfffa8431964d26e5389f0bf1e7fbc990d3f19d39166b7d45"
      - name: Verify activation history and terminal closure authority chain
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_h003_defensive_followup_v1_prospective_activation_v2.py \
            tests/test_h003_defensive_followup_v1_prospective_source_v2.py \
            tests/test_h003_defensive_followup_v1_prospective_recorder_v2.py \
            tests/test_h003_defensive_followup_v1_origin_v2.py \
            tests/test_h003_defensive_followup_v1_prospective_reopen_v2.py \
            tests/test_h003_timing_semantics_reconciliation_v1.py \
            tests/test_h003_prospective_v2_closure.py
      - name: Verify research ledger
        run: PYTHONPATH=. python -m qntylab.research_ledger doctor
      - name: Verify bounded diff hygiene
        run: git diff --check
