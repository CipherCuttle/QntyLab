name: H003 Prospective Operation V2

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h003-prospective-operation-v2
  cancel-in-progress: false

env:
  H003_EVIDENCE_BRANCH: h003-prospective-evidence-v2
  H003_STATE_FILE: h003_prospective_v2_events.jsonl
  H003_STATE_DIR: ${{ github.workspace }}/.h003-prospective-state-v2

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install numpy requests
      - name: Verify activation and runtime binding before source access
        run: |
          PYTHONPATH=. python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          from qntylab.h003_defensive_followup_v1_prospective_source_v2 import validate_activation_authority

          root = Path.cwd()
          runtime_path = root / "experiments/research/h003_defensive_followup_v1/prospective_source_v2_runtime.json"
          runtime = json.loads(runtime_path.read_text(encoding="utf-8"))
          workflow_path = root / runtime["workflow_path"]
          actual = sha256(workflow_path.read_bytes()).hexdigest()
          if actual != runtime["workflow_sha256"]:
              raise SystemExit("H003 operational workflow identity mismatch")
          if runtime["evidence_branch"] != "h003-prospective-evidence-v2":
              raise SystemExit("H003 evidence branch binding mismatch")
          if runtime["force_push"] != "FORBIDDEN":
              raise SystemExit("H003 force-push firewall changed")
          authority = validate_activation_authority(root)
          print(json.dumps({
              "operation_mode": authority["operation_mode"],
              "activation_merge_sha": authority["activation_merge_sha"],
              "source_qualification_merge_sha": authority["source_qualification_merge_sha"],
              "runtime_workflow_sha256": actual,
          }, sort_keys=True))
          PY
      - name: Restore durable evidence ledger
        run: |
          set -euo pipefail
          mkdir -p "$H003_STATE_DIR"
          if git ls-remote --exit-code --heads origin "$H003_EVIDENCE_BRANCH" >/dev/null 2>&1; then
            git fetch --no-tags origin "+refs/heads/$H003_EVIDENCE_BRANCH:refs/remotes/origin/$H003_EVIDENCE_BRANCH"
            git show "refs/remotes/origin/$H003_EVIDENCE_BRANCH:$H003_STATE_FILE" > "$H003_STATE_DIR/$H003_STATE_FILE"
          fi
          if [ -f "$H003_STATE_DIR/$H003_STATE_FILE" ]; then
            sha256sum "$H003_STATE_DIR/$H003_STATE_FILE"
          else
            echo "NO_PRIOR_LEDGER"
          fi
      - name: Record at most the next due H003 hour
        id: record
        run: |
          set -euo pipefail
          BEFORE="MISSING"
          if [ -f "$H003_STATE_DIR/$H003_STATE_FILE" ]; then
            BEFORE="$(sha256sum "$H003_STATE_DIR/$H003_STATE_FILE" | awk '{print $1}')"
          fi
          PYTHONPATH=. python - <<'PY'
          from datetime import UTC, datetime
          import json
          import os
          from pathlib import Path
          from qntylab.h003_defensive_followup_v1_prospective_source_v2 import OperationalRecorder

          operation = OperationalRecorder(Path(os.environ["H003_STATE_DIR"]))
          result = operation.record_due(now=datetime.now(UTC))
          persistence = operation.verify_persistence()
          print(json.dumps({
              "state": result["state"],
              "through_logical_close_utc": result.get("through_logical_close_utc"),
              "operation_mode": result.get("operation_mode"),
              "recorded_hour_count": persistence["recorded_hour_count"],
              "terminal_blocked": persistence["terminal_blocked"],
              "receipt_chain_tip_sha256": persistence["receipt_chain_tip_sha256"],
              "last_event_digest": persistence["last_event_digest"],
          }, sort_keys=True))
          PY
          AFTER="MISSING"
          if [ -f "$H003_STATE_DIR/$H003_STATE_FILE" ]; then
            AFTER="$(sha256sum "$H003_STATE_DIR/$H003_STATE_FILE" | awk '{print $1}')"
          fi
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Persist ledger by fast-forward-only evidence commit
        if: steps.record.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORKTREE="$RUNNER_TEMP/h003-evidence-worktree"
          rm -rf "$WORKTREE"
          if git show-ref --verify --quiet "refs/remotes/origin/$H003_EVIDENCE_BRANCH"; then
            git worktree add -B "$H003_EVIDENCE_BRANCH" "$WORKTREE" "refs/remotes/origin/$H003_EVIDENCE_BRANCH"
          else
            git worktree add --detach "$WORKTREE" HEAD
            cd "$WORKTREE"
            git checkout --orphan "$H003_EVIDENCE_BRANCH"
            git rm -rf .
          fi
          cd "$WORKTREE"
          cp "$H003_STATE_DIR/$H003_STATE_FILE" "$H003_STATE_FILE"
          git add "$H003_STATE_FILE"
          if git diff --cached --quiet; then
            echo "Evidence ledger unchanged; no commit required"
            exit 0
          fi
          TIP="$(tail -n 1 "$H003_STATE_FILE" | sha256sum | awk '{print $1}')"
          git commit -m "research: append H003 prospective evidence ${TIP:0:16}"
          git push origin "HEAD:refs/heads/$H003_EVIDENCE_BRANCH"
          REMOTE="$(git ls-remote origin "refs/heads/$H003_EVIDENCE_BRANCH" | awk '{print $1}')"
          test -n "$REMOTE"
          test "$REMOTE" = "$(git rev-parse HEAD)"
          echo "Persisted evidence branch tip $REMOTE"
