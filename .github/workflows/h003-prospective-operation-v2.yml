name: H003 Prospective Operation V2 — CLOSED

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  H003_CLOSURE_FILE: experiments/research/h003_defensive_followup_v1/prospective_v2_closure.json
  H003_TERMINAL_LEDGER_FILE: experiments/research/h003_defensive_followup_v1/prospective_v2_terminal_ledger.jsonl

jobs:
  closure-status:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false
      - name: Verify canonical H003 V2 terminal closure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path

          closure_path = Path(os.environ["H003_CLOSURE_FILE"])
          ledger_path = Path(os.environ["H003_TERMINAL_LEDGER_FILE"])
          closure = json.loads(closure_path.read_text(encoding="utf-8"))
          ledger_bytes = ledger_path.read_bytes()
          lines = [line for line in ledger_bytes.decode("utf-8").splitlines() if line.strip()]
          if len(lines) != 1:
              raise SystemExit("H003 V2 terminal ledger must contain exactly one event")
          event = json.loads(lines[0])

          expected = {
              "state": "CLOSED_BLOCKED",
              "closure_state": "BLOCKED_MISSED_RECORDING_WINDOW",
              "prospective_origin_utc": "2026-09-12T02:00:00Z",
              "recorded_hour_count": 0,
              "terminal_blocked": True,
              "backfill": "FORBIDDEN",
              "economic_verdict": "FORBIDDEN",
              "successor_requires_new_future_origin": True,
          }
          for key, value in expected.items():
              if closure.get(key) != value:
                  raise SystemExit(f"H003 V2 closure mismatch: {key}")

          if closure.get("terminal_ledger_sha256") != sha256(ledger_bytes).hexdigest():
              raise SystemExit("H003 V2 terminal ledger SHA-256 mismatch")
          if event.get("event_digest") != closure.get("terminal_event_digest"):
              raise SystemExit("H003 V2 terminal event digest mismatch")
          if event.get("event_type") != "RECORDING_BLOCKED":
              raise SystemExit("H003 V2 terminal event type mismatch")

          payload = event.get("payload", {})
          if payload.get("reason") != "MISSED_ONE_HOUR_RECORDING_WINDOW":
              raise SystemExit("H003 V2 terminal reason mismatch")
          if payload.get("through_logical_close_utc") != closure["prospective_origin_utc"]:
              raise SystemExit("H003 V2 terminal logical close mismatch")
          if payload.get("backfill") != "FORBIDDEN":
              raise SystemExit("H003 V2 backfill contract changed")
          if payload.get("economic_verdict") != "FORBIDDEN":
              raise SystemExit("H003 V2 economic verdict boundary changed")

          print(json.dumps({
              "state": closure["state"],
              "closure_state": closure["closure_state"],
              "prospective_origin_utc": closure["prospective_origin_utc"],
              "recorded_hour_count": closure["recorded_hour_count"],
              "backfill": closure["backfill"],
              "terminal_event_digest": closure["terminal_event_digest"],
              "terminal_ledger_sha256": closure["terminal_ledger_sha256"],
              "successor_requires_new_future_origin": closure["successor_requires_new_future_origin"],
          }, sort_keys=True))
          PY
