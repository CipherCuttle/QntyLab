name: H003 Prospective Reopen V2 Materialize

on:
  push:
    branches:
      - research/h003-prospective-reopen-v2
    paths:
      - "qntylab/h003_defensive_followup_v1_prospective_reopen.py"
      - "tests/test_h003_defensive_followup_v1_prospective_reopen_v2.py"
      - "tools/h003_defensive_followup_v1_prospective_reopen_v2_materialize.py"
      - ".github/workflows/h003-prospective-reopen-v2-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h003-prospective-reopen-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install numpy pytest requests
      - name: Materialize prospective-only contract and reopen
        run: PYTHONPATH=. python tools/h003_defensive_followup_v1_prospective_reopen_v2_materialize.py
      - name: Verify prospective reopen v2
        run: PYTHONPATH=. python -m pytest -q tests/test_h003_defensive_followup_v1_prospective_reopen_v2.py tests/test_h003_timing_semantics_reconciliation_v1.py
      - name: Verify research ledger
        run: PYTHONPATH=. python -m qntylab.research_ledger doctor
      - name: Verify bounded diff hygiene
        run: git diff --check
      - name: Commit generated authority evidence
        run: |
          if git diff --quiet -- experiments/specs/h003_defensive_followup_v1_prospective_reopen_v2.json experiments/research/h003_defensive_followup_v1/prospective_reopen_v2_event.json experiments/research/candidates.jsonl experiments/research/state.json experiments/research/trial_index.json; then
            echo "Prospective reopen v2 already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/specs/h003_defensive_followup_v1_prospective_reopen_v2.json experiments/research/h003_defensive_followup_v1/prospective_reopen_v2_event.json experiments/research/candidates.jsonl experiments/research/state.json experiments/research/trial_index.json
          git commit -m "research: materialize H003 prospective-only reopen v2"
          git push origin HEAD:research/h003-prospective-reopen-v2
