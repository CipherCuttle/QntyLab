name: H003 Prospective Reopen V2

on:
  pull_request:
    paths:
      - "experiments/specs/h003_defensive_followup_v1_prospective_reopen_v2.json"
      - "experiments/research/h003_defensive_followup_v1/prospective_reopen_v2_event.json"
      - "experiments/research/h003_defensive_followup_v1/timing_semantics_reconciliation_v1.json"
      - "experiments/research/candidates.jsonl"
      - "experiments/research/state.json"
      - "experiments/research/trial_index.json"
      - "qntylab/h003_defensive_followup_v1_prospective_reopen.py"
      - "tests/test_h003_defensive_followup_v1_prospective_reopen_v2.py"
      - "tests/test_h003_timing_semantics_reconciliation_v1.py"
      - ".github/workflows/h003-prospective-reopen-v2.yml"
  push:
    branches:
      - master
    paths:
      - "experiments/specs/h003_defensive_followup_v1_prospective_reopen_v2.json"
      - "experiments/research/h003_defensive_followup_v1/prospective_reopen_v2_event.json"
      - "experiments/research/h003_defensive_followup_v1/timing_semantics_reconciliation_v1.json"
      - "experiments/research/candidates.jsonl"
      - "experiments/research/state.json"
      - "experiments/research/trial_index.json"
      - "qntylab/h003_defensive_followup_v1_prospective_reopen.py"
      - "tests/test_h003_defensive_followup_v1_prospective_reopen_v2.py"
      - "tests/test_h003_timing_semantics_reconciliation_v1.py"
      - ".github/workflows/h003-prospective-reopen-v2.yml"

permissions:
  contents: read

jobs:
  prospective-reopen-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install numpy pytest requests
      - name: Verify prospective-only reopen and timing reconciliation
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_h003_defensive_followup_v1_prospective_reopen_v2.py \
            tests/test_h003_timing_semantics_reconciliation_v1.py
      - name: Verify research ledger
        run: PYTHONPATH=. python -m qntylab.research_ledger doctor
      - name: Verify bounded diff hygiene
        run: git diff --check
