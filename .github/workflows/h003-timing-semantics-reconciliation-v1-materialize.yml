name: H003 Timing Semantics Reconciliation Materialize

on:
  push:
    branches:
      - research/h003-timing-semantics-reconciliation-v1
    paths:
      - "experiments/research/h003_defensive_followup_v1/timing_semantics_reconciliation_v1.json"
      - "experiments/research/h003_defensive_followup_v1/timing_semantics_reconciliation_decision_event.json"
      - "tests/test_h003_timing_semantics_reconciliation_v1.py"
      - "tools/h003_timing_semantics_reconciliation_v1_materialize.py"
      - ".github/workflows/h003-timing-semantics-reconciliation-v1-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/h003-timing-semantics-reconciliation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install numpy pytest requests
      - name: Materialize fail-closed reconciliation decision
        run: PYTHONPATH=. python tools/h003_timing_semantics_reconciliation_v1_materialize.py
      - name: Verify timing reconciliation and fail-closed state
        run: PYTHONPATH=. python -m pytest -q tests/test_h003_timing_semantics_reconciliation_v1.py
      - name: Verify research ledger
        run: PYTHONPATH=. python -m qntylab.research_ledger doctor
      - name: Verify bounded diff hygiene
        run: git diff --check
      - name: Commit generated ledger evidence
        run: |
          if git diff --quiet -- experiments/research/decisions.jsonl experiments/research/state.json experiments/research/trial_index.json; then
            echo "Ledger evidence already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/research/decisions.jsonl experiments/research/state.json experiments/research/trial_index.json
          git commit -m "research: materialize H003 timing reconciliation block"
          git push origin HEAD:research/h003-timing-semantics-reconciliation-v1
