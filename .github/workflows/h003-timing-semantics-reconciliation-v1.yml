name: H003 Timing Semantics Reconciliation V1

on:
  pull_request:
    paths:
      - "experiments/research/h003_defensive_followup_v1/timing_semantics_reconciliation_v1.json"
      - "experiments/research/h003_defensive_followup_v1/timing_semantics_reconciliation_decision_event.json"
      - "experiments/research/h003_defensive_followup_v1/prospective_origin.json"
      - "experiments/research/decisions.jsonl"
      - "experiments/research/state.json"
      - "experiments/research/trial_index.json"
      - "qntylab/strategies.py"
      - "qntylab/h003_edge_falsification_v0.py"
      - "qntylab/data.py"
      - "tests/test_h003_timing_semantics_reconciliation_v1.py"
      - "tests/test_h003_defensive_followup_v1_origin.py"
      - ".github/workflows/h003-timing-semantics-reconciliation-v1.yml"
  push:
    branches:
      - master
    paths:
      - "experiments/research/h003_defensive_followup_v1/timing_semantics_reconciliation_v1.json"
      - "experiments/research/h003_defensive_followup_v1/timing_semantics_reconciliation_decision_event.json"
      - "experiments/research/h003_defensive_followup_v1/prospective_origin.json"
      - "experiments/research/decisions.jsonl"
      - "experiments/research/state.json"
      - "experiments/research/trial_index.json"
      - "qntylab/strategies.py"
      - "qntylab/h003_edge_falsification_v0.py"
      - "qntylab/data.py"
      - "tests/test_h003_timing_semantics_reconciliation_v1.py"
      - "tests/test_h003_defensive_followup_v1_origin.py"
      - ".github/workflows/h003-timing-semantics-reconciliation-v1.yml"

permissions:
  contents: read

jobs:
  reconciliation-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install numpy pytest requests
      - name: Verify legacy mismatch, reconciliation, and preserved origin evidence
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_h003_timing_semantics_reconciliation_v1.py \
            tests/test_h003_defensive_followup_v1_origin.py
      - name: Verify research ledger is canonical and fail-closed
        run: PYTHONPATH=. python -m qntylab.research_ledger doctor
      - name: Verify bounded diff hygiene
        run: git diff --check
