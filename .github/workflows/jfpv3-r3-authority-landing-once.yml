name: JFPV3 R3 Authority Landing Once

on:
  pull_request:
    paths:
      - ".github/workflows/jfpv3-r3-authority-landing-once.yml"

permissions:
  contents: write

jobs:
  land:
    if: >-
      github.repository == 'CipherCuttle/QntyLab' &&
      github.event.pull_request.number == 273 &&
      github.event.pull_request.head.repo.full_name == 'CipherCuttle/QntyLab' &&
      github.event.pull_request.head.ref == 'agent/jfpv3-transport-window-repair-r3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Verify exact landing setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "bbeb70b0c995b41f7cfd59ed8959cdb677c31ce7"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/jfpv3-r3-authority-landing-once.yml"
          git fetch --no-tags origin master:refs/remotes/origin/master
      - name: Materialize and verify atomic authority repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path

          projects = Path("docs/state/projects.toml")
          text = projects.read_text(encoding="utf-8")
          marker = 'project_id = "JFPV3_PROSPECTIVE_SHADOW_ACTIVATION_AND_FORWARD_COLLECTION_AUTHORIZATION_V0"'
          marker_at = text.index(marker)
          section_start = text.rfind("[[project]]", 0, marker_at)
          next_section = text.find("[[project]]", marker_at)
          if section_start < 0 or next_section < 0:
              raise SystemExit("could not isolate R2 authorization project table")
          section = text[section_start:next_section]
          replacements = {
              'state = "CLOSED_PASS"': 'state = "SUPERSEDED"',
              'authority_level = "FROZEN_PROSPECTIVE_SHADOW_OPERATION_AUTHORIZATION_ONLY"': (
                  'authority_level = "HISTORICAL_SUPERSEDED_OPERATION_AUTHORIZATION_ONLY"\n'
                  'operation_authority_revoked = true\n'
                  'fresh_r3_bound_authorization_required = true'
              ),
              'activation_authorized_after_canonicalization = true': (
                  'activation_authorized_after_canonicalization = false\n'
                  'historical_activation_authorized_after_canonicalization = true'
              ),
              'activation_authorization_canonicalization_required = true': (
                  'activation_authorization_canonicalization_required = false\n'
                  'historical_activation_authorization_canonicalization_required = true'
              ),
              'activations_authorized = 1': 'activations_authorized = 0\nhistorical_activations_authorized = 1',
              'committed_activation_count_allowed = 1': (
                  'committed_activation_count_allowed = 0\n'
                  'historical_committed_activation_count_allowed = 1'
              ),
              'activate_shadow_command = "python -m qntylab.jfp_v3_shadow activate-shadow"': (
                  'historical_activate_shadow_command = "python -m qntylab.jfp_v3_shadow activate-shadow"'
              ),
              'forward_collection_authorized_after_activation = true': (
                  'forward_collection_authorized_after_activation = false\n'
                  'historical_forward_collection_authorized_after_activation = true'
              ),
              'collect_due_command = "python -m qntylab.jfp_v3_shadow collect-due"': (
                  'historical_collect_due_command = "python -m qntylab.jfp_v3_shadow collect-due"'
              ),
              'real_binance_source_access_authorized_only_when_due = true': (
                  'real_binance_source_access_authorized_only_when_due = false\n'
                  'historical_real_binance_source_access_authorized_only_when_due = true'
              ),
              'next_action = "CLOSED_PASS: Canonicalize this authorization, then execute exactly one real activate-shadow, verify the committed 365-origin schedule, and stop before any origin collection unless an origin is actually due. No scientific inference or terminal evaluation is authorized."': (
                  'next_action = "SUPERSEDED: R2 operational authority is revoked before any valid activation. Do not run activate-shadow or collect-due from qntylab.jfp_v3_shadow. A fresh separately Git-backed R3-bound authorization is required before any activation, forward collection, or real Binance source access."'
              ),
          }
          for old, new in replacements.items():
              if section.count(old) != 1:
                  raise SystemExit(f"expected exactly one R2 authority token: {old}")
              section = section.replace(old, new, 1)
          projects.write_text(text[:section_start] + section + text[next_section:], encoding="utf-8")

          test_path = Path("tests/test_jfp_v3_shadow_r3.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_name = "test_r2_operation_authority_is_revoked_until_fresh_r3_authorization"
          if test_name in test_text:
              raise SystemExit("authority regression already exists unexpectedly")
          test_text += '''\n\ndef test_r2_operation_authority_is_revoked_until_fresh_r3_authorization():\n    import tomllib\n\n    registry = tomllib.loads((r3.ROOT / "docs/state/projects.toml").read_text(encoding="utf-8"))\n    rows = [\n        row\n        for row in registry["project"]\n        if row["project_id"]\n        == "JFPV3_PROSPECTIVE_SHADOW_ACTIVATION_AND_FORWARD_COLLECTION_AUTHORIZATION_V0"\n    ]\n    assert len(rows) == 1\n    row = rows[0]\n    assert row["state"] == "SUPERSEDED"\n    assert row["operation_authority_revoked"] is True\n    assert row["fresh_r3_bound_authorization_required"] is True\n    assert row["activation_authorized_after_canonicalization"] is False\n    assert row["activations_authorized"] == 0\n    assert row["committed_activation_count_allowed"] == 0\n    assert row["forward_collection_authorized_after_activation"] is False\n    assert row["real_binance_source_access_authorized_only_when_due"] is False\n    assert "activate_shadow_command" not in row\n    assert "collect_due_command" not in row\n    assert row["historical_activate_shadow_command"] == "python -m qntylab.jfp_v3_shadow activate-shadow"\n    assert row["historical_collect_due_command"] == "python -m qntylab.jfp_v3_shadow collect-due"\n'''
          test_path.write_text(test_text, encoding="utf-8")

          workflow_path = Path(".github/workflows/jfpv3-r3-transport-repair.yml")
          safe = subprocess.check_output(
              ["git", "show", "2c4375bc:.github/workflows/jfpv3-r3-transport-repair.yml"],
              text=True,
          )
          needle = '      - "experiments/research/jigsaw_fast_prospective_signal_discovery_v3/collector_v0r3/**"\n      - ".github/workflows/jfpv3-r3-transport-repair.yml"'
          replacement = '      - "experiments/research/jigsaw_fast_prospective_signal_discovery_v3/collector_v0r3/**"\n      - "docs/state/projects.toml"\n      - "docs/CURRENT_ROADMAP.md"\n      - ".github/workflows/jfpv3-r3-transport-repair.yml"'
          if safe.count(needle) != 1:
              raise SystemExit("safe workflow baseline did not match expected path block")
          workflow_path.write_text(safe.replace(needle, replacement, 1), encoding="utf-8")

          Path(".github/workflows/jfpv3-r3-authority-landing-once.yml").unlink()
          PY
          python -m qntylab.project_context doctor --strict
          python -m qntylab.project_context render
          python -m qntylab.project_context render --check
          test "$(sha256sum docs/state/projects.toml | cut -d' ' -f1)" = "bf889ef842d0b94d9863e7adde2a9747db27aa5cd50040f3f73a71aa2c0ea222"
          test "$(sha256sum docs/CURRENT_ROADMAP.md | cut -d' ' -f1)" = "b01ed3dd35fef9cb5eb4419f938ba16b8c8b5db12369f08ab6c17a2f2edd6436"
          test "$(sha256sum .github/workflows/jfpv3-r3-transport-repair.yml | cut -d' ' -f1)" = "90047153ba8bab6a762bd3a3ccdf413fb2fe08a3f67d0698d1edcc8edcc162dd"
          python -m pip install --disable-pip-version-check "pytest==8.4.2"
          python -m pytest -q tests/test_jfp_v3_shadow.py tests/test_jfp_v3_shadow_r3.py
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {
              ".github/workflows/jfpv3-r3-authority-landing-once.yml",
              ".github/workflows/jfpv3-r3-transport-repair.yml",
              "docs/CURRENT_ROADMAP.md",
              "docs/state/projects.toml",
              "tests/test_jfp_v3_shadow_r3.py",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f"unexpected mutation set: {sorted(changed)}")
          PY
      - name: Commit repair and remove all write-capable landing workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Revoke superseded R2 operation authority"
          git push origin HEAD:agent/jfpv3-transport-window-repair-r3
