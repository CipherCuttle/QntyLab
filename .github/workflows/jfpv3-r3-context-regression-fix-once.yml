name: JFPV3 R3 Context Regression Fix Once

on:
  pull_request:
    paths:
      - ".github/workflows/jfpv3-r3-context-regression-fix-once.yml"

permissions:
  contents: write

jobs:
  fix:
    if: >-
      github.repository == 'CipherCuttle/QntyLab' &&
      github.event.pull_request.number == 273 &&
      github.event.pull_request.head.repo.full_name == 'CipherCuttle/QntyLab' &&
      github.event.pull_request.head.ref == 'agent/jfpv3-transport-window-repair-r3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Verify exact test-only setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "2f26160e3752ed2f6e97a8b82862bc5ceb118854"
          test "$(git diff-tree --no-commit-id --name-only -r HEAD)" = ".github/workflows/jfpv3-r3-context-regression-fix-once.yml"
      - name: Update stale authority expectation and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_project_context_v0.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "def test_jfpv3_prospective_shadow_authorization_is_one_shot_and_non_scientific() -> None:"
          end_marker = "\ndef test_jh01_real_operation_authorization_is_single_active_source_bound_phase() -> None:"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          section = text[start:end]
          replacements = {
              'assert authorization["state"] == "CLOSED_PASS"': 'assert authorization["state"] == "SUPERSEDED"',
              'assert authorization["authority_level"] == "FROZEN_PROSPECTIVE_SHADOW_OPERATION_AUTHORIZATION_ONLY"': (
                  'assert authorization["authority_level"] == "HISTORICAL_SUPERSEDED_OPERATION_AUTHORIZATION_ONLY"\n'
                  '    assert authorization["operation_authority_revoked"] is True\n'
                  '    assert authorization["fresh_r3_bound_authorization_required"] is True'
              ),
              'assert authorization["activation_authorized_after_canonicalization"] is True': (
                  'assert authorization["activation_authorized_after_canonicalization"] is False\n'
                  '    assert authorization["historical_activation_authorized_after_canonicalization"] is True'
              ),
              'assert authorization["activation_authorization_canonicalization_required"] is True': (
                  'assert authorization["activation_authorization_canonicalization_required"] is False\n'
                  '    assert authorization["historical_activation_authorization_canonicalization_required"] is True'
              ),
              'assert authorization["activations_authorized"] == authorization["committed_activation_count_allowed"] == 1': (
                  'assert authorization["activations_authorized"] == authorization["committed_activation_count_allowed"] == 0\n'
                  '    assert authorization["historical_activations_authorized"] == 1\n'
                  '    assert authorization["historical_committed_activation_count_allowed"] == 1'
              ),
              'assert authorization["activate_shadow_command"] == "python -m qntylab.jfp_v3_shadow activate-shadow"': (
                  'assert "activate_shadow_command" not in authorization\n'
                  '    assert authorization["historical_activate_shadow_command"] == "python -m qntylab.jfp_v3_shadow activate-shadow"'
              ),
              'assert authorization["forward_collection_authorized_after_activation"] is True': (
                  'assert authorization["forward_collection_authorized_after_activation"] is False\n'
                  '    assert authorization["historical_forward_collection_authorized_after_activation"] is True'
              ),
              'assert authorization["collect_due_command"] == "python -m qntylab.jfp_v3_shadow collect-due"': (
                  'assert "collect_due_command" not in authorization\n'
                  '    assert authorization["historical_collect_due_command"] == "python -m qntylab.jfp_v3_shadow collect-due"'
              ),
              'assert authorization["real_binance_source_access_authorized_only_when_due"] is True': (
                  'assert authorization["real_binance_source_access_authorized_only_when_due"] is False\n'
                  '    assert authorization["historical_real_binance_source_access_authorized_only_when_due"] is True'
              ),
              'assert authorization["next_action"].startswith("CLOSED_PASS: Canonicalize this authorization")': (
                  'assert authorization["next_action"].startswith("SUPERSEDED: R2 operational authority is revoked")'
              ),
          }
          for old, new in replacements.items():
              if section.count(old) != 1:
                  raise SystemExit(f"expected exactly one stale assertion: {old}")
              section = section.replace(old, new, 1)
          path.write_text(text[:start] + section + text[end:], encoding="utf-8")
          PY
          python -m pip install --disable-pip-version-check "pytest==8.4.2"
          python -m qntylab.project_context doctor --strict
          python -m qntylab.project_context render --check
          python -m pytest -q tests/test_project_context_v0.py::test_jfpv3_prospective_shadow_authorization_is_one_shot_and_non_scientific
          git diff --check
          test "$(git diff --name-only)" = "tests/test_project_context_v0.py"
      - name: Commit only the stale regression repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_project_context_v0.py
          git commit -m "Align project context test with revoked R2 authority"
          git push origin HEAD:agent/jfpv3-transport-window-repair-r3
