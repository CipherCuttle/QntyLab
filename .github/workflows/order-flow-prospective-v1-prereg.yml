name: Order Flow Prospective V1 Prereg

on:
  pull_request:
    paths:
      - "experiments/research/qnty_edge_discovery_order_flow_v1/**"
      - "tests/test_qnty_edge_order_flow_prospective_v1_prereg.py"
      - ".github/workflows/order-flow-prospective-v1-prereg.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-prereg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install frozen test runner
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2"
      - name: Verify preregistration invariants
        run: python -m pytest -q tests/test_qnty_edge_order_flow_prospective_v1_prereg.py
