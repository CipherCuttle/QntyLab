name: Order Flow Prospective V1 Source Qualification

on:
  pull_request:
    paths:
      - "qntylab/order_flow_prospective_v1_source.py"
      - "experiments/research/qnty_edge_discovery_order_flow_v1/recorder_qualification_result.json"
      - "experiments/research/qnty_edge_discovery_order_flow_v1/source_qualification.json"
      - "tests/test_order_flow_prospective_v1_source.py"
      - "tests/test_order_flow_prospective_v1_source_workflow.py"
      - ".github/workflows/order-flow-prospective-v1-source-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify source seam with injected transport
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install frozen test runner
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2"
      - name: Verify source qualification invariants without provider access
        run: python -m pytest -q tests/test_order_flow_prospective_v1_source.py tests/test_order_flow_prospective_v1_source_workflow.py

  live_probe:
    name: one non-scientific first-party provider smoke probe
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, qntylab-eu-source]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: master
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Probe exact Binance USD-M source shape without retaining scientific values
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          from qntylab.order_flow_prospective_v1_source import run_non_scientific_live_probe

          result = run_non_scientific_live_probe()
          assert result["mode"] == "NON_SCIENTIFIC_SOURCE_QUALIFICATION"
          assert result["scientific_evidence"] is False
          assert result["symbol_count"] == 5
          assert result["status"] == "PASS"
          forbidden = {
              "open_price",
              "close_price",
              "quote_asset_volume",
              "taker_buy_quote_asset_volume",
              "signed_taker_quote_imbalance",
          }
          rendered = json.dumps(result, sort_keys=True).lower()
          assert not any(word in rendered for word in forbidden)
          print(json.dumps(result, sort_keys=True))
          PY
