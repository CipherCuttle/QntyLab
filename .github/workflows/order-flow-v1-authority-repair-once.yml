name: Order Flow V1 authority repair once

on:
  push:
    branches:
      - research/order-flow-v1-activation
    paths:
      - .github/workflows/order-flow-v1-authority-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install frozen verification dependencies
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2" requests
      - name: Patch exact P1 authority surface
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import subprocess

          ROOT = Path.cwd()
          OP = ROOT / "qntylab/order_flow_prospective_v1_operation.py"
          TEST = ROOT / "tests/test_order_flow_prospective_v1_activation.py"
          RUNTIME = ROOT / "experiments/research/qnty_edge_discovery_order_flow_v1/prospective_runtime.json"
          PROJECTS = ROOT / "docs/state/projects.toml"
          PROJECT_ID = "QNTY_EDGE_ORDER_FLOW_PROSPECTIVE_V1_ACTIVATION"

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              OP,
              "from . import order_flow_prospective_v1_recorder as recorder\nfrom . import order_flow_prospective_v1_source as source\n",
              "from . import order_flow_prospective_v1_recorder as recorder\nfrom . import order_flow_prospective_v1_source as source\nfrom . import project_context\n",
              "operation import",
          )
          replace_once(
              OP,
              'RECORDER_GIT_BLOB_SHA = "02daadaa597dcf00789af66c01fe13e66031ec3d"\n',
              'RECORDER_GIT_BLOB_SHA = "02daadaa597dcf00789af66c01fe13e66031ec3d"\nPROJECT_ID = "QNTY_EDGE_ORDER_FLOW_PROSPECTIVE_V1_ACTIVATION"\n',
              "project id constant",
          )
          replace_once(
              OP,
              '    expected_activation = {\n        "state": "ACTIVE",\n        "activation_scope": "PROSPECTIVE_COLLECTION_ONLY",\n',
              '    expected_activation = {\n        "state": "AUTHORIZED_IF_CANONICAL",\n        "activation_scope": "PROSPECTIVE_COLLECTION_ONLY",\n        "candidate_branch_is_authority": False,\n        "activation_effective_on_branch": False,\n        "canonicalization_required_before_effect": True,\n        "activation_effective": "AFTER_EXACT_CANONICAL_MERGE_AND_MATCHING_LOCAL_UNIT_INSTALL_ONLY",\n',
              "activation state gate",
          )
          replace_once(
              OP,
              '    authority = activation.get("authority")\n    if not isinstance(authority, dict):\n        raise OperationBlocked("activation authority is malformed")\n',
              '    branch_authority = activation.get("branch_authority")\n    if not isinstance(branch_authority, dict):\n        raise OperationBlocked("branch activation authority is malformed")\n    for key in (\n        "real_market_data_access_authorized",\n        "prospective_collection_authorized",\n        "scheduler_authorized",\n        "scientific_recording_authorized",\n    ):\n        if branch_authority.get(key) is not False:\n            raise OperationBlocked(f"branch-local live authority opened: {key}")\n\n    authority = activation.get("authority_after_canonicalization")\n    if not isinstance(authority, dict):\n        raise OperationBlocked("post-canonical activation authority is malformed")\n',
              "branch authority firewall",
          )
          replace_once(
              OP,
              '    return {\n        "state": "ACTIVE",\n        "probe_canonical_master_sha": PROBE_CANONICAL_MASTER_SHA,\n',
              '    return {\n        "state": "AUTHORIZED_IF_CANONICAL",\n        "probe_canonical_master_sha": PROBE_CANONICAL_MASTER_SHA,\n',
              "activation validation return",
          )

          marker = "\ndef _validate_installed_units(root: Path) -> None:\n"
          insertion = '''\ndef validate_project_authority(root: Path) -> dict[str, Any]:
              """Require canonical project-context authority for this bounded phase."""
              data = project_context.context_data(root)
              active = data.get("active_project")
              if not isinstance(active, dict) or active.get("project_id") != PROJECT_ID:
                  raise OperationBlocked("canonical project context does not authorize Order Flow V1 activation")
              if active.get("state") != "ACTIVE" or active.get("implementation_authorized") is not True:
                  raise OperationBlocked("Order Flow V1 project authority is not ACTIVE implementation authority")
              if active.get("implementation_completed") is not False:
                  raise OperationBlocked("Order Flow V1 activation phase lifecycle is malformed")
              for key, expected in (
                  ("candidate_branch_is_authority", False),
                  ("activation_effective_on_branch", False),
                  ("canonicalization_required_before_effect", True),
                  ("real_market_data_access_authorized_on_branch", False),
                  ("prospective_collection_authorized_on_branch", False),
                  ("scheduler_authorized_on_branch", False),
                  ("scientific_recording_authorized_on_branch", False),
                  ("post_canonical_real_market_data_access_authorized", True),
                  ("post_canonical_prospective_collection_authorized", True),
                  ("post_canonical_scheduler_authorized", True),
                  ("post_canonical_scientific_recording_authorized", True),
                  ("interim_scientific_evaluation_authorized", False),
                  ("terminal_evaluation_authorized", False),
                  ("router_authorized", False),
                  ("qnty_authorized", False),
                  ("qntyspot_authorized", False),
              ):
                  if active.get(key) is not expected:
                      raise OperationBlocked(f"canonical project authority mismatch: {key}")
              for key in ("trading_authority", "capital_authority", "signing_authority", "submission_authority"):
                  if active.get(key) != "NONE":
                      raise OperationBlocked(f"forbidden downstream authority opened: {key}")
              if active.get("backfill") != "FORBIDDEN" or active.get("source_substitution") != "FORBIDDEN":
                  raise OperationBlocked("canonical no-backfill/source-substitution boundary changed")
              return {
                  "project_id": PROJECT_ID,
                  "state": "ACTIVE",
                  "implementation_authorized": True,
                  "activation_effective_on_branch": False,
                  "canonicalization_required_before_effect": True,
              }
          '''
          replace_once(OP, marker, insertion + marker, "project authority validator")
          replace_once(
              OP,
              "    validate_activation_artifacts(root)\n    _validate_installed_units(root)\n",
              "    validate_activation_artifacts(root)\n    validate_project_authority(root)\n    _validate_installed_units(root)\n",
              "canonical preflight authority",
          )
          replace_once(
              OP,
              "def status(root: Path, state_dir: Path) -> dict[str, Any]:\n    authority = validate_activation_artifacts(root)\n    ledger = recorder.EvidenceLedger(state_dir)\n",
              "def status(root: Path, state_dir: Path) -> dict[str, Any]:\n    authority = validate_activation_artifacts(root)\n    project_authority = validate_project_authority(root)\n    ledger = recorder.EvidenceLedger(state_dir)\n",
              "status authority",
          )
          replace_once(
              OP,
              "        **authority,\n        \"ledger_event_count\": len(ledger.events()),\n",
              "        **authority,\n        \"project_authority\": project_authority,\n        \"ledger_event_count\": len(ledger.events()),\n",
              "status authority output",
          )

          replace_once(
              TEST,
              '    assert activation["state"] == "ACTIVE"\n    assert activation["activation_scope"] == "PROSPECTIVE_COLLECTION_ONLY"\n',
              '    assert activation["state"] == "AUTHORIZED_IF_CANONICAL"\n    assert activation["activation_scope"] == "PROSPECTIVE_COLLECTION_ONLY"\n    assert activation["candidate_branch_is_authority"] is False\n    assert activation["activation_effective_on_branch"] is False\n    assert activation["canonicalization_required_before_effect"] is True\n    assert activation["activation_effective"] == "AFTER_EXACT_CANONICAL_MERGE_AND_MATCHING_LOCAL_UNIT_INSTALL_ONLY"\n',
              "test activation state",
          )
          replace_once(
              TEST,
              '    authority = activation["authority"]\n',
              '    branch_authority = activation["branch_authority"]\n    assert branch_authority["real_market_data_access_authorized"] is False\n    assert branch_authority["prospective_collection_authorized"] is False\n    assert branch_authority["scheduler_authorized"] is False\n    assert branch_authority["scientific_recording_authorized"] is False\n\n    authority = activation["authority_after_canonicalization"]\n',
              "test branch authority",
          )
          replace_once(
              TEST,
              '    assert operation.validate_activation_artifacts(ROOT)["state"] == "ACTIVE"\n\n\ndef test_frozen_required_close_grid_is_exact():\n',
              '    assert operation.validate_activation_artifacts(ROOT)["state"] == "AUTHORIZED_IF_CANONICAL"\n\n\ndef test_project_context_authorizes_only_bounded_activation_implementation():\n    authority = operation.validate_project_authority(ROOT)\n    assert authority == {\n        "project_id": operation.PROJECT_ID,\n        "state": "ACTIVE",\n        "implementation_authorized": True,\n        "activation_effective_on_branch": False,\n        "canonicalization_required_before_effect": True,\n    }\n\n\ndef test_frozen_required_close_grid_is_exact():\n',
              "test project authority",
          )

          projects_text = PROJECTS.read_text(encoding="utf-8")
          if f'project_id = "{PROJECT_ID}"' in projects_text:
              raise SystemExit("Order Flow V1 activation project row already exists")
          row = r'''

          [[project]]
          project_id = "QNTY_EDGE_ORDER_FLOW_PROSPECTIVE_V1_ACTIVATION"
          display_name = "Order Flow Prospective V1 local activation implementation"
          state = "ACTIVE"
          authority_level = "BOUNDED_PROSPECTIVE_ACTIVATION_IMPLEMENTATION_CANDIDATE_ONLY"
          phase_type = "IMPLEMENTATION"
          authoritative_artifacts = [
            "AGENTS.md",
            "docs/state/projects.toml",
            "docs/CURRENT_ROADMAP.md",
            "experiments/research/qnty_edge_discovery_order_flow_v1/preregistration.json",
            "experiments/research/qnty_edge_discovery_order_flow_v1/source_live_probe_result.json",
            "experiments/research/qnty_edge_discovery_order_flow_v1/prospective_activation.json",
            "experiments/research/qnty_edge_discovery_order_flow_v1/prospective_runtime.json",
            "qntylab/order_flow_prospective_v1_operation.py",
            "qntylab/order_flow_prospective_v1_source.py",
            "qntylab/order_flow_prospective_v1_recorder.py",
            "ops/systemd/user/order-flow-v1-prospective-record.service",
            "ops/systemd/user/order-flow-v1-prospective-record.timer",
            "tests/test_order_flow_prospective_v1_activation.py",
          ]
          candidate_id = "CANDIDATE_ORDER_FLOW_SIGNED_TAKER_QUOTE_IMBALANCE_INCREMENTAL_RETURN_V1"
          canonical_base_sha = "1bd98b3769f27e9ded363058c316bd00e81cea0f"
          source_live_probe_state = "PASS"
          source_live_probe_canonical_sha = "1bd98b3769f27e9ded363058c316bd00e81cea0f"
          authority_source = "EXPLICIT_USER_AUTHORITY_REPRESENTED_BY_THIS_GIT_BACKED_PHASE"
          implementation_authorized = true
          implementation_completed = false
          candidate_branch_is_authority = false
          activation_effective_on_branch = false
          canonicalization_required_before_effect = true
          real_market_data_access_authorized_on_branch = false
          prospective_collection_authorized_on_branch = false
          scheduler_authorized_on_branch = false
          scientific_recording_authorized_on_branch = false
          post_canonical_real_market_data_access_authorized = true
          post_canonical_prospective_collection_authorized = true
          post_canonical_scheduler_authorized = true
          post_canonical_scientific_recording_authorized = true
          interim_scientific_evaluation_authorized = false
          terminal_evaluation_authorized = false
          router_authorized = false
          qnty_authorized = false
          qntyspot_authorized = false
          trading_authority = "NONE"
          capital_authority = "NONE"
          signing_authority = "NONE"
          submission_authority = "NONE"
          backfill = "FORBIDDEN"
          source_substitution = "FORBIDDEN"
          next_action = "IMPLEMENT_AND_VERIFY_ONLY: finish the bounded activation candidate without live provider access on the branch. After exact canonical merge, install matching local user units from a clean dedicated operational worktree at origin/master; only then begin frozen prospective collection. No backfill or interim evaluation."
          '''.lstrip("\n")
          PROJECTS.write_text(projects_text.rstrip() + "\n\n" + row, encoding="utf-8")

          operation_blob = subprocess.check_output(
              ["git", "hash-object", "qntylab/order_flow_prospective_v1_operation.py"],
              text=True,
          ).strip()
          runtime = json.loads(RUNTIME.read_text(encoding="utf-8"))
          runtime["operation_git_blob_sha"] = operation_blob
          RUNTIME.write_text(json.dumps(runtime, indent=2) + "\n", encoding="utf-8")
          print(f"pinned operation blob {operation_blob}")
          PY
      - name: Regenerate canonical roadmap
        run: python -m qntylab.project_context render
      - name: Verify repaired authority and regressions
        run: |
          set -euo pipefail
          python -m qntylab.project_context doctor --strict
          python -m qntylab.project_context render --check
          python -m pytest -q \
            tests/test_order_flow_prospective_v1_activation.py \
            tests/test_order_flow_prospective_v1_source.py \
            tests/test_order_flow_prospective_v1_recorder.py \
            tests/test_project_context_v0.py
          git diff --check
      - name: Commit only bounded non-workflow repair files
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              "docs/state/projects.toml",
              "docs/CURRENT_ROADMAP.md",
              "experiments/research/qnty_edge_discovery_order_flow_v1/prospective_runtime.json",
              "qntylab/order_flow_prospective_v1_operation.py",
              "tests/test_order_flow_prospective_v1_activation.py",
          }
          changed = {
              line.strip()
              for line in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
              if line.strip()
          }
          if changed != allowed:
              raise SystemExit(f"unexpected repair surface: {sorted(changed)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/state/projects.toml \
            docs/CURRENT_ROADMAP.md \
            experiments/research/qnty_edge_discovery_order_flow_v1/prospective_runtime.json \
            qntylab/order_flow_prospective_v1_operation.py \
            tests/test_order_flow_prospective_v1_activation.py
          git commit -m "research: repair Order Flow V1 canonical activation authority"
          git push origin HEAD:research/order-flow-v1-activation
