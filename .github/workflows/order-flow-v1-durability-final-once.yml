name: Order Flow V1 durability final once

on:
  push:
    branches:
      - research/order-flow-v1-activation
    paths:
      - .github/workflows/order-flow-v1-durability-final-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.14"
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check "pytest==8.4.2" requests
      - name: Apply bounded P1 repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          python .github/order-flow-v1-durability-final.py
          python -m py_compile qntylab/order_flow_prospective_v1_operation.py
      - name: Verify bounded repair
        run: |
          set -euo pipefail
          python -m qntylab.project_context doctor --strict
          python -m qntylab.project_context render --check
          python -m pytest -q \
            tests/test_order_flow_prospective_v1_activation.py \
            tests/test_order_flow_prospective_v1_source.py \
            tests/test_order_flow_prospective_v1_recorder.py \
            tests/test_project_context_v0.py
          git diff --check
      - name: Commit only repair files
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              "experiments/research/qnty_edge_discovery_order_flow_v1/prospective_runtime.json",
              "ops/systemd/user/order-flow-v1-prospective.md",
              "qntylab/order_flow_prospective_v1_operation.py",
              "tests/test_order_flow_prospective_v1_activation.py",
          }
          changed = {line for line in subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines() if line}
          if changed != expected:
              raise SystemExit(f"unexpected repair surface: {sorted(changed)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/research/qnty_edge_discovery_order_flow_v1/prospective_runtime.json \
            ops/systemd/user/order-flow-v1-prospective.md \
            qntylab/order_flow_prospective_v1_operation.py \
            tests/test_order_flow_prospective_v1_activation.py
          git commit -m "research: harden Order Flow V1 durable local authority"
          git push origin HEAD:research/order-flow-v1-activation
