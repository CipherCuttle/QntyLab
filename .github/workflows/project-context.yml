name: Project Context

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      identity_mode:
        description: "Explicit identity mode: CANDIDATE_HEAD | SYNTHETIC_PR_MERGE_RESULT | CANONICAL_MASTER"
        required: false
        type: choice
        options:
          - CANDIDATE_HEAD
          - SYNTHETIC_PR_MERGE_RESULT
          - CANONICAL_MASTER
      pull_request_number:
        description: "PR number to synthesize a merge ref for (SYNTHETIC_PR_MERGE_RESULT only)"
        required: false
        type: string

permissions:
  contents: read

# C3 (QNTYLAB_DEV_LOOP_CI_SPLIT_V0): fast core dev-loop workflow.
# The heavy DSH Stage-A reconciliation / pinned-runtime materialization /
# historical replay responsibilities that previously lived in this single
# monolith moved VERBATIM to .github/workflows/project-context-heavy-replay.yml.
# No core check was dropped; triggers, permissions, identity semantics, and
# command ordering are unchanged. The tri-state identity bootstrap below is
# mechanically duplicated in the heavy workflow (bounded duplication, not a
# generic CI framework) so each workflow execution still records exactly one
# explicit identity mode (CI_MODEL).
jobs:
  project-context:
    runs-on: ubuntu-latest
    steps:
      # Tri-state identity model (CI_MODEL). The same workflow can run against
      # three distinct repository identities, and each is checked out EXPLICITLY
      # so the commands below never silently test an ambient ref:
      #   - CANDIDATE_HEAD            : exact PR head SHA (github.event.pull_request.head.sha)
      #   - SYNTHETIC_PR_MERGE_RESULT : the synthetic merge ref (refs/pull/<n>/merge),
      #                                 i.e. head merged into the current base
      #   - CANONICAL_MASTER           : refs/heads/master on push
      # We do NOT claim all three are identical or that every invocation tests
      # all three; each run records exactly one identity mode, and the explicit
      # identity_mode input forces a specific mode on workflow_dispatch.
      - name: Resolve identity mode
        id: identity
        run: |
          if [ -n "${{ github.event.inputs.identity_mode }}" ]; then
            echo "mode=${{ github.event.inputs.identity_mode }}" >> "$GITHUB_OUTPUT"
            case "${{ github.event.inputs.identity_mode }}" in
              CANDIDATE_HEAD)
                echo "checkout_ref=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT";;
              SYNTHETIC_PR_MERGE_RESULT)
                echo "checkout_ref=refs/pull/${{ github.event.inputs.pull_request_number }}/merge" >> "$GITHUB_OUTPUT";;
              CANONICAL_MASTER)
                echo "checkout_ref=refs/heads/master" >> "$GITHUB_OUTPUT";;
            esac
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=CANDIDATE_HEAD" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=CANONICAL_MASTER" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=refs/heads/master" >> "$GITHUB_OUTPUT"
          fi
          echo "SYNTHETIC_PR_MERGE_RESULT is reachable via workflow_dispatch with identity_mode=SYNTHETIC_PR_MERGE_RESULT and pull_request_number."
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.identity.outputs.checkout_ref }}
      - name: Record identity mode
        run: |
          echo "IDENTITY_MODE=${{ steps.identity.outputs.mode }}" >> "$GITHUB_ENV"
          echo "CHECKED_OUT_REF=${{ steps.identity.outputs.checkout_ref }}"
          echo "HEAD_SHA=$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest requests
      - run: python -m qntylab.project_context doctor --strict
      - run: python -m qntylab.project_context render --check
      - run: python -m qntylab.project_context spine > /dev/null
      - run: python -m qntylab.project_context brief > /dev/null
      - run: python -m qntylab.research_ledger doctor
      # The canonical doctor pass is exact-equality on the ACTUAL checked-out
      # identity. The identity mode is recorded so a PR-branch run that does not
      # sit exactly at canonical master is never misreported as a canonical test.
      - run: python -m pytest -q tests/test_project_context_v0.py tests/test_context_spine_foundation_v0.py tests/test_context_spine_brief_v0.py tests/test_context_spine_orientation_completeness_v0.py
