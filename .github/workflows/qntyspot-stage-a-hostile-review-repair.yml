name: QntySpot Stage A hostile-review repair

on:
  push:
    branches:
      - research/qntyspot-shadow-performance-reauthorization-v1
    paths:
      - .github/workflows/qntyspot-stage-a-hostile-review-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/qntyspot-shadow-performance-reauthorization-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: python -m pip install pytest requests

      - name: Apply bounded hostile-review repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          projects = Path('docs/state/projects.toml')
          text = projects.read_text(encoding='utf-8')
          marker = 'project_id = "QNTYSPOT_INK_SHADOW_PERFORMANCE_RESEARCH_V1"'
          start = text.index(marker)
          block_start = text.rfind('[[project]]', 0, start)
          next_block = text.find('\n[[project]]', start)
          block_end = len(text) if next_block == -1 else next_block
          block = text[block_start:block_end]
          stale = '  "experiments/research/qntyspot_ink_shadow_performance_dev_acquisition_activation_v0/activation.json",\n'
          if block.count(stale) != 1:
              raise SystemExit('expected exactly one stale activation authority entry in fresh QntySpot row')
          block = block.replace(stale, '', 1)
          text = text[:block_start] + block + text[block_end:]
          projects.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_qntyspot_ink_shadow_performance_research_v1.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '    assert authorization["project_id"] == row["project_id"]\n'
          assertion = (
              '    assert "experiments/research/qntyspot_ink_shadow_performance_dev_acquisition_activation_v0/activation.json" '
              'not in row["authoritative_artifacts"]\n'
          )
          if assertion not in test:
              if test.count(anchor) != 1:
                  raise SystemExit('expected one project-row assertion anchor')
              test = test.replace(anchor, anchor + assertion, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Verify bounded repair
        shell: bash
        run: |
          python -m qntylab.project_context doctor
          python -m qntylab.project_context render --check
          python -m qntylab.research_ledger doctor
          python -m pytest -q tests/test_project_context_v0.py tests/test_qntyspot_ink_shadow_performance_research_v1.py
          git diff --check
          test -z "$(git diff 67fc6f003875c5228333fd28511cc7ff76af0427 --name-only -- experiments/research/qnty_edge_order_flow_prospective_v1_activation qntylab | grep -v '^qntylab/qntyspot_ink_shadow_performance_prereg_v0.py$' || true)"

      - name: Remove one-shot helper and commit repair
        shell: bash
        run: |
          rm .github/workflows/qntyspot-stage-a-hostile-review-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/state/projects.toml tests/test_qntyspot_ink_shadow_performance_research_v1.py .github/workflows/qntyspot-stage-a-hostile-review-repair.yml
          git diff --cached --check
          git commit -m 'Repair QntySpot Stage A authority boundary'
          git push origin HEAD:research/qntyspot-shadow-performance-reauthorization-v1
