name: QntySpot Stage B block attestation repair verification

on:
  push:
    branches:
      - research/qntyspot-stage-b-block-attestation-parallel-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest             tests/test_qntyspot_ink_source_qualification_v1.py             tests/test_qntyspot_ink_shadow_performance_dev_acquisition_research_v1.py             -q
          python -m py_compile qntylab/qntyspot_ink_source_qualification_v1.py
          git diff --check origin/master...HEAD
