name: QntySpot Stage B canonical QuickNode v2

on:
  push:
    branches:
      - ops/qntyspot-stage-b-canonical-quicknode-v2

permissions:
  contents: read

jobs:
  secondary:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout canonical master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact canonical Stage B backoff runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "master"
          test -z "$(git status --porcelain)"
          git fetch --quiet origin master
          test "$(git rev-parse HEAD)" = "3ef577469465fe83a65180bb455a6eb2423b65c5"
          test "$(git rev-parse origin/master)" = "3ef577469465fe83a65180bb455a6eb2423b65c5"
          git merge-base --is-ancestor 56b751ebab695192b8e12d47cc62f3fa9a2c6801 HEAD

      - name: Qualify official QuickNode source on canonical backoff runtime
        env:
          QNTYSPOT_INK_RPC_URL: https://rpc-qnd.inkonchain.com
        shell: bash
        run: |
          set -euo pipefail
          python qntylab/qntyspot_ink_source_qualification_v1.py \
            --provider-id ink-official-quicknode-public \
            --probe-span 10000 \
            --coverage-workers 2 \
            --output secondary.json
          cat secondary.json

      - name: Upload secondary receipt
        uses: actions/upload-artifact@v4
        with:
          name: qntyspot-stage-b-canonical-quicknode-v2-receipt
          path: secondary.json
          if-no-files-found: error
          retention-days: 30
