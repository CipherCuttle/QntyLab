name: QntySpot Stage B DEV acquisition verifier

on:
  push:
    branches:
      - research/qntyspot-stage-b-dev-acquisition-v1

permissions:
  contents: read

concurrency:
  group: qntyspot-stage-b-dev-acquisition-verifier
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused offline verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest
          python -m pytest -q \
            tests/test_qntyspot_ink_source_qualification_v1.py \
            tests/test_qntyspot_ink_dev_acquisition_v1.py
          python -m py_compile \
            qntylab/qntyspot_ink_source_qualification_v1.py \
            qntylab/qntyspot_ink_dev_acquisition_v1.py
          git diff --check origin/master...HEAD
