name: QntySpot Stage B Gelato retry v1

on:
  push:
    branches:
      - ops/qntyspot-stage-b-gelato-retry-v1

permissions:
  contents: read

jobs:
  primary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout canonical master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact canonical Stage B runtime merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "master"
          test -z "$(git status --porcelain)"
          git fetch --quiet origin master
          test "$(git rev-parse HEAD)" = "a839306a13f4a810be46835dbfcc043041f161a5"
          test "$(git rev-parse origin/master)" = "a839306a13f4a810be46835dbfcc043041f161a5"
          git merge-base --is-ancestor 2649ba0606e432974971f99f1fa347c569e1454c HEAD

      - name: Qualify official Gelato source at rate-safe concurrency
        env:
          QNTYSPOT_INK_RPC_URL: https://rpc-gel.inkonchain.com
        shell: bash
        run: |
          set -euo pipefail
          python qntylab/qntyspot_ink_source_qualification_v1.py \
            --provider-id ink-official-gelato-public \
            --probe-span 10000 \
            --coverage-workers 2 \
            --output primary.json
          cat primary.json

      - name: Upload primary receipt
        uses: actions/upload-artifact@v4
        with:
          name: qntyspot-stage-b-gelato-retry-receipt
          path: primary.json
          if-no-files-found: error
          retention-days: 30
