name: QntySpot Stage B qualification runtime repair

on:
  push:
    branches:
      - research/qntyspot-stage-b-qualification-runtime-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: research/qntyspot-stage-b-qualification-runtime-v1
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded runtime repair
        run: python .github/scripts/qntyspot_stage_b_runtime_repair.py

      - name: Verify focused Stage B gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile qntylab/qntyspot_ink_source_qualification_v1.py
          pytest -q \
            tests/test_qntyspot_ink_source_qualification_v1.py \
            tests/test_qntyspot_ink_shadow_performance_dev_acquisition_research_v1.py \
            tests/test_qntyspot_ink_shadow_performance_research_v1.py \
            tests/test_project_context_v0.py
          git diff --check

      - name: Commit verified runtime repair
        shell: bash
        env:
          BRANCH: research/qntyspot-stage-b-qualification-runtime-v1
        run: |
          set -euo pipefail
          rm .github/workflows/qntyspot-stage-b-qualification-runtime-repair.yml
          rm .github/scripts/qntyspot_stage_b_runtime_repair.py
          git config user.name "CipherCuttle"
          git config user.email "97258089+CipherCuttle@users.noreply.github.com"
          git add -A
          git commit -m "Optimize Stage B source qualification runtime"
          git push origin HEAD:"$BRANCH"
