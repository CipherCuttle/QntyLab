name: QntySpot Stage B rate-limit backoff repair

on:
  push:
    branches:
      - research/qntyspot-stage-b-rate-limit-backoff-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: research/qntyspot-stage-b-rate-limit-backoff-v1
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verifier
        run: python -m pip install --quiet pytest

      - name: Apply transport-only repair
        run: python .github/scripts/qntyspot_stage_b_rate_limit_backoff_repair.py

      - name: Verify semantic repair
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile qntylab/qntyspot_ink_source_qualification_v1.py
          python -m pytest -q \
            tests/test_qntyspot_ink_source_qualification_v1.py \
            tests/test_qntyspot_ink_shadow_performance_dev_acquisition_research_v1.py
          git diff --check

      - name: Commit exact semantic candidate without harness
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qntyspot-stage-b-rate-limit-backoff-repair.yml
          rm .github/scripts/qntyspot_stage_b_rate_limit_backoff_repair.py
          git config user.name "CipherCuttle"
          git config user.email "97258089+CipherCuttle@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Stage B RPC rate-limit transport"
          echo "SEMANTIC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:research/qntyspot-stage-b-rate-limit-backoff-v1

      - name: Pin reviewed semantic candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          old = "2649ba0606e432974971f99f1fa347c569e1454c"
          new = os.environ["SEMANTIC_SHA"]
          paths = [
              Path("docs/state/projects.toml"),
              Path("experiments/research/qntyspot_ink_shadow_performance_dev_acquisition_research_v1/authorization.json"),
              Path("tests/test_qntyspot_ink_shadow_performance_dev_acquisition_research_v1.py"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one old reviewed-candidate pin, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          python -m pytest -q \
            tests/test_qntyspot_ink_source_qualification_v1.py \
            tests/test_qntyspot_ink_shadow_performance_dev_acquisition_research_v1.py
          git diff --check
          git add \
            docs/state/projects.toml \
            experiments/research/qntyspot_ink_shadow_performance_dev_acquisition_research_v1/authorization.json \
            tests/test_qntyspot_ink_shadow_performance_dev_acquisition_research_v1.py
          git diff --cached --check
          git commit -m "Pin reviewed Stage B backoff candidate"
          git push origin HEAD:research/qntyspot-stage-b-rate-limit-backoff-v1
