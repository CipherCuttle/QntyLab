name: QntySpot Stage B registry rotation

on:
  push:
    branches:
      - research/qntyspot-shadow-performance-dev-acquisition-v1
    paths:
      - .github/workflows/qntyspot-stage-b-registry-rotation.yml

permissions:
  contents: write

jobs:
  rotate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/qntyspot-shadow-performance-dev-acquisition-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: python -m pip install pytest requests

      - name: Rotate Stage A to Stage B research authority
        run: |
          python .github/scripts/qntyspot_stage_b_registry_rotation.py
          python -m qntylab.project_context render

      - name: Verify Stage B authority candidate
        run: |
          python -m qntylab.project_context doctor --strict
          python -m qntylab.project_context render --check
          python -m qntylab.research_ledger doctor
          python -m pytest -q \
            tests/test_project_context_v0.py \
            tests/test_qntyspot_ink_shadow_performance_research_v1.py \
            tests/test_qntyspot_ink_shadow_performance_dev_acquisition_research_v1.py \
            tests/test_qntyspot_ink_source_qualification_v1.py
          git diff --check
          test -z "$(git diff ea2dd02964c2e91196bb153a212ec0f8aae50b42 --name-only -- experiments/research/qnty_edge_order_flow_prospective_v1_activation || true)"

      - name: Remove one-shot helpers and commit bounded rotation
        run: |
          rm .github/workflows/qntyspot-stage-b-registry-rotation.yml
          rm .github/scripts/qntyspot_stage_b_registry_rotation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            docs/state/projects.toml \
            docs/CURRENT_ROADMAP.md \
            tests/test_project_context_v0.py \
            tests/test_qntyspot_ink_shadow_performance_research_v1.py \
            .github/workflows/qntyspot-stage-b-registry-rotation.yml \
            .github/scripts/qntyspot_stage_b_registry_rotation.py
          git diff --cached --check
          git commit -m 'Rotate QntySpot research authority to Stage B'
          git push origin HEAD:research/qntyspot-shadow-performance-dev-acquisition-v1
