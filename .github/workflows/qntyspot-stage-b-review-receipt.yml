name: QntySpot Stage B review receipt

on:
  push:
    branches:
      - research/qntyspot-shadow-performance-dev-acquisition-v1
    paths:
      - .github/scripts/qntyspot_stage_b_review_receipt.py
      - .github/workflows/qntyspot-stage-b-review-receipt.yml

permissions:
  contents: write

jobs:
  receipt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/qntyspot-shadow-performance-dev-acquisition-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verification dependencies
        run: python -m pip install pytest requests

      - name: Record review receipt
        run: python .github/scripts/qntyspot_stage_b_review_receipt.py

      - name: Verify receipt-only closure
        run: |
          python -m qntylab.project_context doctor --strict
          python -m qntylab.project_context render --check
          python -m qntylab.research_ledger doctor
          python -m pytest -q \
            tests/test_project_context_v0.py \
            tests/test_qntyspot_ink_shadow_performance_research_v1.py \
            tests/test_qntyspot_ink_shadow_performance_dev_acquisition_research_v1.py \
            tests/test_qntyspot_ink_source_qualification_v1.py
          git diff --check
          test -z "$(git diff 3668d8f93481492b8e209f8fd6996fd3b558eb63 --name-only -- qntylab/qntyspot_ink_source_qualification_v1.py)"
          test -z "$(git diff ea2dd02964c2e91196bb153a212ec0f8aae50b42 --name-only -- experiments/research/qnty_edge_order_flow_prospective_v1_activation || true)"

      - name: Commit review receipt and remove helpers
        run: |
          rm .github/scripts/qntyspot_stage_b_review_receipt.py
          rm .github/workflows/qntyspot-stage-b-review-receipt.yml
          git config user.name "CipherCuttle"
          git config user.email "97258089+CipherCuttle@users.noreply.github.com"
          git add -A
          git commit -m "Record Stage B hostile review receipt"
          git push origin HEAD:research/qntyspot-shadow-performance-dev-acquisition-v1
