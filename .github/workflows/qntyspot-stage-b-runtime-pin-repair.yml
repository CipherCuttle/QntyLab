name: QntySpot Stage B runtime pin repair

on:
  push:
    branches:
      - research/qntyspot-stage-b-qualification-runtime-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: research/qntyspot-stage-b-qualification-runtime-v1
          fetch-depth: 0
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verifier dependencies
        run: python -m pip install pytest requests
      - name: Apply reviewed candidate pin repair
        run: python .github/scripts/qntyspot_stage_b_runtime_pin_repair.py
      - name: Verify focused Stage B gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_qntyspot_ink_source_qualification_v1.py \
            tests/test_qntyspot_ink_shadow_performance_dev_acquisition_research_v1.py \
            tests/test_qntyspot_ink_shadow_performance_research_v1.py \
            tests/test_project_context_v0.py
          git diff --check
      - name: Commit verified pin repair
        shell: bash
        env:
          BRANCH: research/qntyspot-stage-b-qualification-runtime-v1
        run: |
          set -euo pipefail
          rm .github/workflows/qntyspot-stage-b-runtime-pin-repair.yml
          rm .github/scripts/qntyspot_stage_b_runtime_pin_repair.py
          git config user.name "CipherCuttle"
          git config user.email "97258089+CipherCuttle@users.noreply.github.com"
          git add -A
          git commit -m "Pin reviewed Stage B runtime candidate"
          git push origin HEAD:"$BRANCH"
