name: QntySpot Stage B Tenderly secondary qualification

on:
  push:
    branches:
      - ops/qntyspot-stage-b-secondary-tenderly-v1

permissions:
  contents: read

jobs:
  secondary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout canonical master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact canonical Stage B merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "master"
          test -z "$(git status --porcelain)"
          git fetch --quiet origin master
          test "$(git rev-parse HEAD)" = "aa49ec7087ca9deba15f841d4f59bc743ecd0200"
          test "$(git rev-parse origin/master)" = "aa49ec7087ca9deba15f841d4f59bc743ecd0200"

      - name: Metadata-only Tenderly preflight
        env:
          QNTYSPOT_INK_RPC_URL: https://rpc-ten.inkonchain.com
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from qntylab.qntyspot_ink_source_qualification_v1 import (
              CHAIN_ID,
              POOL,
              JsonRpcClient,
              _cutoff_timestamp,
              _hex_int,
              assert_canonical_stage_b_authority,
              find_block_at_or_before_timestamp,
              find_first_code_block,
          )

          assert_canonical_stage_b_authority(Path('.').resolve())
          rpc = JsonRpcClient(os.environ['QNTYSPOT_INK_RPC_URL']).call
          chain_id = _hex_int(rpc('eth_chainId', []))
          if chain_id != CHAIN_ID:
              raise SystemExit(f'chain mismatch: {chain_id}')
          t1 = find_block_at_or_before_timestamp(rpc, _cutoff_timestamp())
          deployment = find_first_code_block(rpc, POOL, _hex_int(t1['number']))
          print({'chain_id': chain_id, 't1_block': _hex_int(t1['number']), 'deployment_block': deployment})
          PY

      - name: Qualify official Tenderly source
        env:
          QNTYSPOT_INK_RPC_URL: https://rpc-ten.inkonchain.com
        shell: bash
        run: |
          set -euo pipefail
          python qntylab/qntyspot_ink_source_qualification_v1.py \
            --provider-id ink-official-tenderly-public \
            --probe-span 10000 \
            --output secondary.json

      - name: Emit sanitized secondary receipt
        shell: bash
        run: |
          set -euo pipefail
          cat secondary.json

      - name: Upload secondary receipt
        uses: actions/upload-artifact@v4
        with:
          name: qntyspot-stage-b-tenderly-secondary-receipt
          path: secondary.json
          if-no-files-found: error
          retention-days: 30
