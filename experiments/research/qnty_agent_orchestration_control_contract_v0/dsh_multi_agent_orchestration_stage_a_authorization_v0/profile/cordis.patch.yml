# Frozen Stage-A patch layer (DSH_MULTI_AGENT_ORCHESTRATION_STAGE_A_AUTHORIZATION_V0).
# Applied after the dsh-base and dsh-headless bundle layers, over an otherwise
# empty profile. Registers exactly the two child subagent providers and the
# OpenAI-backed parent model route; sets no other plugin.
- insert:
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          openai:
            apiKeyEnv: OPENAI_API_KEY
            retryPolicy:
              mode: normal
              maxRetries: 2
            models:
              - id: gpt-5-mini
                maxTokens: 4096
- id: agent-default-model
  config:
    provider: openai
    model: gpt-5-mini
