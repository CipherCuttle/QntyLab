# V1R3R2 qualification-only profile overlay. The predecessor artifact is
# intentionally reused unchanged: it leaves exactly the two native child
# tools model-facing and routes the parent to the loopback mock.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-web
  disabled: true
- id: plan-mode
  disabled: true
- id: session-title-llm
  disabled: true
- id: agent-default-model
  config:
    provider: openai
    model: gpt-5-mini
- id: llm-pi-ai
  config:
    providers:
      openai:
        apiKeyEnv: QNTYLAB_QUAL_OPENAI_API_KEY
        baseURL: !!js process.env.QNTYLAB_QUAL_OPENAI_BASE_URL
        api: openai-completions
        models:
          - id: gpt-5-mini
            name: gpt-5-mini
            contextWindow: 128000
            maxTokens: 16384
- insert:
    - id: subagent-codex
      name: '@deepseek-ai/dsh-subagent-codex'
    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed
    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed
